# Review R9: a base that does not resolve to a sha256 digest (an empty or
# odd answer from the registry) must stop the build, not leave an empty
# label and a build FROM the moving tag. (A skopeo failure is caught twice,
# by the call and by this format check, so only the format check is
# mutated: that is the line a lenient edit would touch.)
name = "resolve-base-ignores-failure"
file = ".github/scripts/resolve-base.sh"
old = '''if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
  echo "::error::the base image ${ref} resolved to '${digest}', not a sha256 digest" >&2
  exit 1
fi'''
new = '''if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
  echo "::warning::the base image ${ref} resolved to '${digest}', not a sha256 digest" >&2
fi'''
must_fail = "bash tests/resolve-base.test.sh"
