<?xml version="1.0" encoding="UTF-8"?>
<!-- Lucciola System app icon, Adwaita full-color style: a laptop seen
     front-on, its screen the Lucciola dusk (the wallpaper's sky), with a
     beige check that glows like the firefly: "this machine is current".
     The file keeps the app id's name (dev.margine.System, see system-gui). -->
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1f38"/>
      <stop offset="0.6" stop-color="#3b2d49"/>
      <stop offset="1" stop-color="#7a4f3a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>
  <!-- screen -->
  <rect x="20" y="22" width="88" height="62" rx="10" fill="url(#screen)"/>
  <rect x="20" y="22" width="88" height="62" rx="10" fill="none" stroke="#121212" stroke-width="2"/>
  <!-- base -->
  <rect x="10" y="90" width="108" height="12" rx="6" fill="#36313f"/>
  <!-- check mark: a soft halo, then the beige stroke -->
  <path d="M 42 54 l 14 14 l 28 -28" fill="none" stroke="#f0cf9c" stroke-opacity="0.55" stroke-width="13"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M 42 54 l 14 14 l 28 -28" fill="none" stroke="#e6d5bf" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
