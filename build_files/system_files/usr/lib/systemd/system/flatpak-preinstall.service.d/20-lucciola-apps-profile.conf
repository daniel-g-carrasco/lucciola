# Lucciola: a slim or naked app set chosen while this first-boot install
# was still running (the welcome window asks at the first login) is applied
# as the install ends: /usr/libexec/lucciola/feature reads the choice from
# /var/lib/lucciola/apps-profile-pending, masks this unit and removes the
# apps that set leaves out. Nothing to do without a pending choice.
[Service]
ExecStartPost=-/usr/libexec/lucciola/feature slim apply-pending
