# Margine hardening for the inherited flatpak-preinstall.service (forum 12247).
#
# The stock unit has Restart=on-failure + StartLimitBurst=3 /
# StartLimitIntervalSec=600: three first-boot failures (e.g. a transient
# network blip, or a momentarily-broken repo) inside 10 min leave the unit
# PERMANENTLY 'failed' and it never re-fires on its own — so the deferred
# creative Flatpaks (GIMP/Inkscape/darktable/OBS) never install even after
# the network/repo recovers.
#
# StartLimitIntervalSec=0 removes the lockout so it keeps retrying. The
# ExecStartPre lines (the '-' prefixed ones are non-fatal) guarantee a
# valid, unfiltered Flathub remote exists and repair a partial system repo
# BEFORE the pull, mirroring the ensure-flathub guard the gaming recipes
# already use. Self-healing fallback for the bake.
#
# The relabel is the fix for the 2026-06 fresh-install P0: when the bake
# landed (the repo is already valid) it is a no-op, but if the bake was
# lost and `flatpak remote-add` had to CREATE /var/lib/flatpak/repo from
# scratch, that dir could land mislabeled (unconfined_u:var_t) and confined
# flatpak would then be denied opendir(repo/objects) — the exact crash-loop
# CyberOto hit. Relabeling before the pull keeps the fallback self-healing.
#
# 2026-10-20: the relabel and `flatpak repair` no longer run at every boot.
# On a laptop with 351 refs they took 34 s and 53 s, peaked at 15-17 GB
# (page cache) and held multi-user.target for 89 s, for an installation
# that was fine. flatpak-repo-repair runs them when the last preinstall did
# not pass (first boot, failure, interruption) or a cheap check finds the
# repo broken, at most once per boot; ExecStartPost marks a run that
# passed. A settled boot does the cheap steps only, about 1.5 s.
[Unit]
StartLimitIntervalSec=0
# Not ordered before multi-user.target (or graphical.target): a target
# waits for every unit it wants unless that unit sets
# DefaultDependencies=no. The first boot's downloads and a repair, when
# one is due, run beside the session instead of in front of it. The
# default dependencies the line drops are written out below.
DefaultDependencies=no
Requires=sysinit.target
After=sysinit.target basic.target
Conflicts=shutdown.target
Before=shutdown.target

[Service]
RestartSec=120
# Bounded: a stuck pull (no timeout of its own) is killed and retried by
# Restart=on-failure two minutes later; Flatpak resumes what it fetched.
# An hour covers the first boot's ~2 GB on a slow line.
TimeoutStartSec=1h
# Background work: the same priority as margine-flatpak-update.service,
# and the page cache a repair or a big install fills is reclaimed from
# this unit first instead of pushing the session's memory out.
Nice=10
IOSchedulingClass=idle
MemoryHigh=2G
StateDirectory=margine/flatpak-preinstall
# FIRST: reset a STRUCTURALLY corrupt repo — repo/ present but objects/
# missing, the signature of an install truncated mid-bake (2026-07-04
# incident: gnome-shell segfault killed the live session, anaconda stops
# when its WebUI viewer dies, the bake rsync was cut between app/ and
# repo/). None of the heals below can fix that state: remote-add, repair
# AND the preinstall itself all die on opendir(objects), so the unit
# crash-loops forever (verified on the installed VM). A healthy repo is
# never touched. See /usr/libexec/margine/flatpak-repo-heal.
ExecStartPre=-/usr/libexec/margine/flatpak-repo-heal
ExecStartPre=-/usr/bin/flatpak remote-add --if-not-exists --system flathub https://dl.flathub.org/repo/flathub.flatpakrepo
# The "fedora" and "fedora-testing" remotes a stock Silverblue or Kinoite
# leaves behind go, unless apps were installed from them (2026-10-20).
ExecStartPre=-/usr/libexec/margine/flatpak-remote-tidy
# restorecon -RF /var/lib/flatpak and flatpak repair --system, when due
# (see above and /usr/libexec/margine/flatpak-repo-repair).
ExecStartPre=-/usr/libexec/margine/flatpak-repo-repair
ExecStartPre=-/usr/bin/flatpak remote-modify --system flathub --no-filter
# LAST, and without '-': `flatpak preinstall` uninstalls an app it once
# preinstalled as soon as the image stops listing it (2026-10-18: Bitwarden,
# VS Code, Blanket and Fragments left the list and left the machines). The
# helper hands such apps to the user before the sync, and if it fails the
# sync does not run at all. See /usr/libexec/margine/flatpak-preinstall-keep.
ExecStartPre=/usr/libexec/margine/flatpak-preinstall-keep
# Only after a preinstall that worked: the next boot can skip the repair.
ExecStartPost=-/usr/libexec/margine/flatpak-repo-repair --passed
