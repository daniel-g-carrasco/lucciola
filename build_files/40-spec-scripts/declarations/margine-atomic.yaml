# Margine declarative spec.
# Bump schema_version when a backwards-incompatible structural change happens
# (key renamed, section moved, required-field added). Cosmetic / additive
# changes do not need a bump.
schema_version: 1
status: stable
profile:
  id: margine-fedora-atomic-gnome
  name: Margine Fedora Atomic GNOME
  phase: manual-lab
  language: en

base:
  family: fedora-atomic-desktop
  variant: margine
  derives_from: silverblue-main   # Universal Blue main; bluefin-dx until 2026-10-11 (ADR 0010)
  fedora_release: 44
  desktop: gnome
  # Lucciola (2026-10): the login screen is greetd running Noctalia Greeter
  # (lucciola/build.sh step 5); GDM stays installed as greetd's fallback
  # and for the GNOME session. Checked by validate-margine-system (6b) and
  # validate-image-rootfs.sh (A.3.login).
  login_screen:
    display_manager: greetd
    greeter: noctalia-greeter   # built from a pinned upstream tag (Containerfile greeter-rpm stage)
    pam_service: greetd         # /usr/lib/pam.d/greetd, Fedora's, plus pam_oo7 (password) and pam_env lines
    autologin: greetd initial_session   # ujust margine-autologin
    fallback: gdm               # greetd.service OnFailure=
  architecture: x86_64
  update_engine: bootc
  legacy_variants_for_reference:
    - silverblue        # phase-0 lab base, before ADR 0005
    - bluefin-dx        # phase-1 rebase target, then the published image's base until 2026-10-11
  image_workflow:
    current: lucciola-bootc-image   # margine-bootc-image until 2026-10 (Lucciola was built FROM it)
    image_ref: ghcr.io/daniel-g-carrasco/lucciola:stable
    build_repo: https://github.com/daniel-g-carrasco/lucciola
    legacy_paths:
      - stock-silverblue-lab        # scripts/apply-host-layer
      - bluefin-dx-rebase-adapter   # scripts/apply-margine-on-bluefin
    future_candidates:
      - native-ostree-compose
  bluefin_pivot:
    note: >
      Margine deploys as Bluefin DX rebased + a small Margine delta
      (see docs/adr/0005-base-on-bluefin-dx.md). The stock-silverblue
      apply-host-layer path is preserved for audit/learning but is no
      longer the recommended install path.
    rebase_target: "ostree-unverified-registry:ghcr.io/ublue-os/bluefin-dx:stable"
    track_choice: stable
    track_choice_reason: >
      Bluefin LTS is built on CentOS Stream 10 (EPEL10, RHEL-derived
      kernel, dnf4). That breaks CachyOS COPR (Fedora-only) and
      shrinks RPMFusion coverage. Margine needs the Fedora track.
    dx_choice_reason: >
      DX already includes the virt stack + container tooling that the
      stock Silverblue layer was adding (libvirt, qemu-kvm, virt-
      manager, swtpm, edk2-ovmf, distrobox, podman-compose). Going with
      base Bluefin would force us to re-layer them.
      UPDATE 2026-08-25: upstream has announced the end of the -dx
      images ("all userspace", ujust devmode). build_files/15-devstack
      now backfills exactly these pieces whenever the base lacks them,
      so the base is a build ARG (Containerfile BASE_IMAGE) and the
      switch to ghcr.io/projectbluefin/bluefin is a one-line change
      validated by a :trial build, not a re-layering scramble.
    margine_delta:
      kernel:
        action: rpm-ostree override remove kernel kernel-core kernel-modules kernel-modules-core kernel-modules-extra --install kernel-cachyos
        source: copr:bieszczaders/kernel-cachyos
      terminal:
        action: inherit Bluefin default (Ptyxis); no override
      configure_user_state:
        action: configure-{home-layout,default-applications,zen-browser,darktable-import} (ujust margine-bootstrap, by hand)

updates:
  orchestrator: uupd
  orchestrator_note: >
    uupd (Universal Blue's updater) runs daily from uupd.timer and
    orchestrates bootc upgrade + flatpak update + brew update + distrobox
    upgrade in the right order, with reboot detection. Bluefin DX shipped
    it; since 2026-10-11 build_files/15-devstack installs it from the
    ublue-os/packages COPR when the base lacks it. No custom update
    orchestrator is needed or maintained. The validators below are
    on-demand health checks, not pre/post-update hooks.
  system:
    engine: bootc
    transport: ostree-image-signed
    image_ref: ghcr.io/daniel-g-carrasco/lucciola:stable
    require_reboot_judgment: true
  bootc:
    phase: shipping
    orchestrated_by: uupd
  firmware:
    automatic: false
    reason: requires-hardware-runbook
  validators_on_demand:
    # The 7 validators shipped in the image as /usr/bin/margine-validate-*
    # (fetched by margine-image 40-spec-scripts; run together by
    # `ujust margine-doctor`). Kept in sync with that fetch list —
    # this list rotted at 4 entries while the image shipped 7
    # (caught 2026-06-12).
    - scripts/validate-margine-system
    - scripts/validate-declared-state
    - scripts/validate-atomic-layout
    - scripts/validate-cachyos-kernel
    - scripts/validate-branding
    - scripts/validate-hardware-media-stack
    - scripts/validate-gaming-runtime
    # Dev-side tools (not shipped in the image):
    - scripts/validate-staged-deployment  # curl|bash before rebooting into a staged deployment
    - scripts/collect-diagnostics

storage:
  installer: fedora-anaconda
  filesystem: btrfs
  encryption:
    required: true
    format: luks2
  btrfs_subvolumes:
    naming_note: >
      Anaconda on Fedora creates top-level subvolumes without the @ prefix
      (root, home, var). The @data subvolume is our addition; the @ prefix
      is kept only to visually mark it as not Anaconda-created in
      `btrfs subvolume list`. Nested subvolumes have no separate name and
      are identified by their path within the parent subvolume.
    list:
      - path: root
        anaconda_created: true
        mount: "/"
        note: ostree-managed; do not snapshot manually
      - path: home
        anaconda_created: true
        mount: "/var/home"
        note: snapshot target; dotfiles and user state only
        snapshot_intent: high-value-dotfiles
      - path: var
        anaconda_created: true
        mount: "/var"
        note: system writable state
      - path: "home/<user>/.cache"
        anaconda_created: false
        parent: home
        nested: true
        mount: "/var/home/<user>/.cache"
        phase: post-install
        note: excluded from `home` snapshots; regenerable cache
        snapshot_intent: none
      - path: "home/<user>/dev"
        anaconda_created: false
        parent: home
        nested: true
        mount: "/var/home/<user>/dev"
        phase: post-install
        note: excluded from `home` snapshots; git is the source of truth
        snapshot_intent: none
      - path: "home/<user>/scratch"
        anaconda_created: false
        parent: home
        nested: true
        mount: "/var/home/<user>/scratch"
        phase: post-install
        note: excluded from `home` snapshots; disposable by contract
        snapshot_intent: none
      - path: "@data"
        anaconda_created: false
        mount: "/var/home/<user>/data"
        phase: post-install
        note: independent top-level subvolume; own backup policy (e.g. Koofr)
        snapshot_intent: independent
  expected_paths:
    root: ostree-deployment
    usr: read-only
    etc: writable
    var: writable
    home: /var/home
    home_cache: /var/home/<user>/.cache
    home_dev: /var/home/<user>/dev
    home_scratch: /var/home/<user>/scratch
    data: /var/home/<user>/data

security:
  secure_boot:
    required: true
    baseline: stock-fedora-shim-bootloader-kernel
    custom_signing:
      mechanism: mok
      signed_at: image-build-time
      key_format: rsa-2048
      signs:
        - vmlinuz       # via sbsign
        - kernel-modules  # via scripts/sign-file per .ko/.ko.xz/.ko.zst/.ko.gz
      enrollment:
        iso_install: anaconda-post-nochroot-mokutil-import
        rebase_fallback_unit: mok-enroll.service
        certificate_path: /usr/share/cert/MOK.der
        marker_path: /var/.mok-enrolled
        marker_owner: rebase_fallback_unit
      keys:
        public_in_repo:
          - margine-image/secrets/MOK.pem
          - margine-image/secrets/MOK.der
        private_in_repo: false
        private_storage: github-actions-secret (MOK_KEY) + local backup
  tpm2_auto_unlock:
    required: true
    tool: systemd-cryptenroll
    crypttab_option: tpm2-device=auto
    keep_recovery_passphrase: true
    pcr_policy:
      vm_lab: "0"
      hardware_target: "0+7"
      validation_note: >
        PCR 0 (Platform Firmware) alone survives kernel + initramfs changes
        and is the right choice for VM lab where Secure Boot is off. PCR 7
        (Secure Boot state) is added on hardware where Secure Boot is
        enrolled with the Margine MOK and the boot chain is stable.
  secrets_policy:
    store_in_repo: false

kernel:
  shipped:
    provider: cachyos-copr
    repo: bieszczaders/kernel-cachyos
    package: kernel-cachyos
    signed_with: margine-mok
    secure_boot_compliant: true
    installed_at: image-build-time
  fallback:
    provider: fedora
    available_via: rpm-ostree rollback (previous deployment)
  legacy_layered_path_for_reference:
    method: rpm-ostree override remove kernel{,-core,-modules,-modules-core,-modules-extra} --install kernel-cachyos
    secure_boot_compliant: false
    note: kept in docs/03 for completeness; superseded by image-baked + MOK-signed

host_packages:
  baseline_note: >
    Reference list of what the Margine baseline expects to find on disk.
    On the shipping path the base (Universal Blue's silverblue-main since
    2026-10-11, Bluefin DX before) provides part of `baseline` and
    build_files/15-devstack installs the rest when the base lacks it.
    This section is the contract `validate-declared-state` checks the
    image against.

    The legacy `scripts/apply-host-layer` (Silverblue phase-0 lab path)
    uses this same list to layer the packages on stock Silverblue.
  baseline_provided_by: silverblue-main-and-15-devstack
  baseline:
    # ---------------------------------------------------------------------
    # creator_tier: shared userland tools that benefit BOTH creator
    # workflows and gaming. scx-scheds since 2026-06-03, steam-devices
    # since 2026-06-05. mangohud and goverlay were here from 2026-06-05 to
    # 2026-10-18; they moved to the opt-in gaming layer (ujust
    # margine-gaming, ujust margine-gaming-native), see gaming_runtime.
    # ---------------------------------------------------------------------
    creator_tier:
      install:
        - scx-scheds         # sched_ext schedulers (CachyOS addons COPR); pro-audio + interactive
        - steam-devices      # udev rules for controllers/jog wheels (creator + gaming)
      source_notes: |
        scx-scheds comes from copr:bieszczaders/kernel-cachyos-addons
        (same maintainer as the kernel COPR; released as a pair).
        steam-devices comes from Fedora. See
        build_files/custom-kernel/install.sh.
    rpmfusion:
      # Free only, at build time, for v4l2loopback's akmod (custom-kernel);
      # nonfree is no longer enabled anywhere (2026-10-18).
      enable_free: true
      enable_nonfree: false
      install_release_rpms_from: https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm
    codec_replacement:
      override_remove:
        - ffmpeg-free
        - libavcodec-free
        - libavdevice-free
        - libavfilter-free
        - libavformat-free
        - libavutil-free
        - libswresample-free
        - libswscale-free
      install:
        - ffmpeg
        # negativo17's build (epoch 1), NOT RPMFusion's -freeworld: the base
        # multimedia stack (ffmpeg/x265/ugly) is negativo17, and RPMFusion's
        # freeworld variant links the OLD libx265.so.215 while negativo17 ships
        # x265 4.2 (.216) — unresolvable mix that broke the 2026-07-04 base
        # build. negativo17's gstreamer1-plugins-bad is a superset of freeworld
        # (bundles libgstx265.so, libgstva.so, nvcodec/msdk/qsv, fdkaac).
        - gstreamer1-plugins-bad
        - gstreamer1-plugins-ugly
      install_note: >
        Validated against quay.io/fedora/fedora:44 + RPMFusion via
        scripts/validate-baseline-packages (both existence and dependency
        resolution simulation under Silverblue-like conditions).

        ffmpeg pulls ffmpeg-libs, which conflicts with libavcodec-free /
        libavutil-free / libswresample-free from the base. All four base
        packages must be override-removed together so rpm-ostree can
        complete the transaction.

        The following Mesa freeworld supplements are intentionally
        SKIPPED for now:
          - mesa-va-drivers-freeworld
          - mesa-vulkan-drivers-freeworld
        Reason: at the time of this baseline, Mesa in Fedora updates is
        26.0.6 while Mesa in RPMFusion is 26.0.3 / 26.0.7 (lagging behind).
        dnf can reconcile via --allowerasing (downgrading the base Mesa
        bits); rpm-ostree cannot do downgrade. They will be reintroduced
        when RPMFusion catches up (usually 1-2 weeks after a Mesa point
        release). Effect of skipping: H.264/HEVC hardware decode/encode
        via VA-API GPU path is unavailable; fallbacks remain available:
          - ffmpeg full handles software decode/encode of all patented codecs
          - Mesa base (with mesa-dri-drivers) covers VP9 / AV1 hardware
            decode where the GPU supports it
          - Vulkan video (Mesa base) covers H.264/HEVC on newer GPUs
        Re-add the two packages once the validator passes them.

        Other symbols intentionally not listed:
          - gstreamer1-libav      virtual provides; real package
                                  gstreamer1-plugin-libav already in base
          - gstreamer1-vaapi      merged into gstreamer1-plugins-bad-*
          - libavif / libheif     already in the Silverblue base
          - mesa-va-drivers       does not exist as separate package on F44
          - mesa-vdpau-drivers    does not exist on F44 (VDPAU deprecated)
    media_diagnostics:
      - mesa-demos
      - mesa-libGLU
      - vulkan-tools
      - libva-utils
      - clinfo
    audio_baseline:
      - pipewire-utils
      - pipewire-pulseaudio
      - pipewire-alsa
      - wireplumber
      - alsa-utils
    hardware_diagnostics:
      - lm_sensors
      - powertop
      - powerstat
      - fwupd
      - ddcutil
      - usbutils
      - pciutils
      - smartmontools
    gnome_tools:
      - gnome-tweaks
      - libappindicator-gtk3
      - nautilus-python
      - adw-gtk3-theme
      - showtime
    gnome_tools_note: >
      No GNOME Shell extension is declared or shipped (2026-10-18): GNOME
      is Lucciola's stock fallback session, with only the extensions
      Fedora's gnome-shell-extensions package brings for GNOME Classic.
      Margine's set (o-tiling, hide-cursor, Dash to Dock, AppIndicator,
      GSConnect, Caffeine, the Smile, Gradia and Bazaar companions) left
      with its Shell defaults and keybindings.
    creative_apps_note: >
      darktable is installed as a host package (not Flatpak) so it picks
      up the host OpenCL ICD automatically. With ROCm (AMD) or
      intel-compute-runtime (Intel) installed via
      optional_after_validation.{amd,intel}_gpu_extras, darktable's
      "Preferences → Processing → OpenCL" lists the GPU device and uses
      it for raw export, tone mapping, and denoise — 5–20× faster than
      CPU-only mode. The Flatpak does not see the host ICD without an
      explicit permission override, so we prefer the layered path here.
    creative_apps:
      - darktable
    fonts:
      - jetbrains-mono-fonts
      - ibm-plex-sans-fonts
      - ibm-plex-mono-fonts
      - ibm-plex-serif-fonts
      - cascadia-code-fonts
      - adobe-source-code-pro-fonts
      - adobe-source-sans-pro-fonts
      - adobe-source-serif-pro-fonts
      - atkinson-hyperlegible-next-fonts
      - atkinson-hyperlegible-mono-fonts
      - google-carlito-fonts
      - google-crosextra-caladea-fonts
      - liberation-sans-fonts
      - liberation-serif-fonts
      - liberation-mono-fonts
      - google-noto-color-emoji-fonts
      - google-noto-sans-cjk-vf-fonts   # variable build; 14-fonts replaces the static google-noto-sans-cjk-fonts a base may ship
    # Shells and compatibility bits a user may rely on. Bluefin DX carried
    # them, Universal Blue's main does not (image diff of 2026-10-11);
    # 15-devstack installs them.
    user_shells_and_compat:
      - ptyxis          # the terminal (Super+Return, ujust, nautilus-open-any-terminal)
      - zsh
      - fish
      - fuse-libs
      - gnome-tweaks
      - xdg-terminal-exec
      - ncurses-term
      - libxcrypt-compat
    # The desktop's own applications. The base ships them; they are
    # declared because 12-base-trim's dependency cascade took them once
    # (2026-10-11) and nothing noticed until a user looked for the terminal.
    gnome_desktop_core:
      - nautilus
      - gnome-system-monitor
      - gnome-bluetooth
      # Fedora 45's base dropped these; Margine kept them (15-devstack).
      - NetworkManager-ssh-gnome
      - nm-connection-editor
  optional_after_validation:
    # Layered on demand by `ujust margine-vm` (in the image until 2026-10-18).
    virtualization:
      - libvirt
      - libvirt-nss
      - qemu-kvm
      - virt-manager
      - virt-viewer
      - virt-install
      - edk2-ovmf
      - swtpm
      - dnsmasq
      - podman-machine
    intel_gpu_extras:
      - libva-intel-media-driver
      - intel-compute-runtime
      - intel-opencl
      - igt-gpu-tools
      - intel-vpl-gpu-rt
    amd_gpu_extras:
      - rocm-opencl
      - rocm-hip        # HIP runtime (Blender); the compiler it requires is replaced by margine-rocm-hip-runtime, see 15-devstack
      - rocminfo
      - radeontop
    framework_audio_optional:
      - easyeffects
      - lsp-plugins-lv2
      - lsp-plugins-ladspa
      - lsp-plugins-vst3
    gaming_runtime:
      # Layered by ujust margine-gaming (gamescope, mangohud, vkBasalt,
      # goverlay); gamemode comes with the base, steam-devices with the image.
      # ujust margine-gaming-native layers its own list,
      # /usr/share/margine/gaming-native-packages.txt.
      desktop_host_helpers:
        - gamescope
        - mangohud
        - vkBasalt
        - gamemode
        - goverlay
        - steam-devices
      diagnostics:
        - vulkan-tools
        - mesa-demos
      capture_optional:
        - obs-studio-plugin-vkcapture
        - obs-studio-plugin-vaapi
    tailscale:
      enabled_by_default: false
      repo: https://pkgs.tailscale.com/stable/fedora/tailscale.repo
      packages:
        - tailscale

flatpaks:
  remotes:
    - name: flathub
      url: https://flathub.org/repo/flathub.flatpakrepo
  default_apps:
    # Canonical default-app set — matches the preinstall file the image
    # generates (margine-image 20-flatpaks: BAKE + DEFER merged, 42 apps).
    # This list had rotted to 13 entries (one with a wrong id:
    # org.mozilla.Thunderbird vs the shipped thunderbird_esr) by
    # 2026-06-12; realigned during the code-quality review.
    # Not preinstalled since 2026-10-18: com.visualstudio.code (`ujust
    # margine-vscode` layers the RPM), com.bitwarden.desktop,
    # org.gnome.Weather, org.gnome.Maps, com.rafaelmardojai.Blanket,
    # de.haeckerfelix.Fragments. Installed systems keep them.
    internet:
      - app.zen_browser.zen
    productivity:
      - org.mozilla.thunderbird_esr
      - org.libreoffice.LibreOffice
      - com.github.jeromerobert.pdfarranger  # merge, split, reorder PDF pages (2026-09-19)
      - com.github.johnfactotum.Foliate  # e-book reader: EPUB, MOBI, FB2, CBZ (2026-10-09)
    gnome_core:
      # Silverblue ships these as RPMs; Bluefin DX strips them; Margine
      # restores them as Flatpaks for a complete GNOME desktop without
      # /usr layer cost.
      - org.gnome.Calculator
      - org.gnome.Calendar
      - org.gnome.clocks
      - org.gnome.Contacts
      - org.gnome.TextEditor
      - org.gnome.baobab
      - org.gnome.Characters
      - org.gnome.Logs
      - org.gnome.font-viewer
      - org.gnome.Snapshot
      - org.gnome.Showtime
      - org.gnome.Papers
      - org.gnome.Loupe
      - org.gnome.SoundRecorder
    graphics:
      - org.gimp.GIMP
      - org.inkscape.Inkscape
      - com.github.PintaProject.Pinta
      - be.alexandervanhee.gradia  # screenshot annotation (2026-09-19)
      - com.github.huluti.Curtail  # image compression (2026-09-19)
      - org.darktable.Darktable
      - io.gitlab.adhami3310.Impression
    multimedia:
      - com.github.neithern.g4music
      - org.audacityteam.Audacity
      - com.obsproject.Studio
      - io.github.wartybix.Constrict  # video compression to a target size (2026-09-19)
      - com.github.wwmm.easyeffects
    system_utilities:
      - com.ranfdev.DistroShelf
      - com.github.tchx84.Flatseal
      - io.github.flattool.Warehouse
      - io.github.flattool.Ignition
      - io.missioncenter.MissionCenter
      - org.gnome.DejaDup
      - org.gnome.Firmware
      - net.sapples.LiveCaptions  # on-device captions for any audio; floats over the video (2026-09-22)
      - io.github.kolunmi.Bazaar  # the app store; in Margine's own lists since 2026-10-10 (it only came from Bluefin's bazaar.preinstall)
    documentation:
      # GTK 4 markdown viewer/editor (libadwaita). Used as the default
      # `.md` opener so docs in margine-fedora-atomic and similar repos
      # render cleanly with a double click.
      - org.gnome.gitlab.somas.Apostrophe
    # Development: no Flatpak editor is preinstalled by Margine.
    # Bluefin DX already ships Visual Studio Code (from the Microsoft
    # repository) with dev container tooling wired up, and Margine
    # keeps that as the default IDE. See docs/16-developer-toolbox.md.
  optional_apps:
    gaming:
      # Installed by `ujust margine-gaming` (Flatpak path; the native
      # path swaps Steam/Lutris/RetroArch for layered RPMs).
      - com.valvesoftware.Steam
      - net.lutris.Lutris
      - com.heroicgameslauncher.hgl
      - com.usebottles.bottles
      - com.github.Matoking.protontricks
      - com.vysp3r.ProtonPlus
    emulation_optional:
      - org.libretro.RetroArch
      - net.retrodeck.retrodeck
      - page.kramo.Cartridges

toolbox:
  default:
    image: fedora-toolbox:45
    packages:
      core_cli:
        - git
        - git-credential-libsecret
        - gh
        - tmux
        - ripgrep
        - fd-find
        - jq
        - bat
        - eza
        - btop
        - neovim
        - fastfetch
        - just
        - glow
        - gum
      build_essentials:
        - gcc
        - gcc-c++
        - make
        - pkgconf
        - python3-pip
        - nodejs
        - npm
      container_tooling:
        - podman-compose
        - podman-tui
        - distrobox
      shells_optional:
        - fish
        - zsh
  user_layer:
    brew:
      install_user_level: true
      install_url: https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh
      install_path: ~/.linuxbrew
      note: >
        Homebrew on Linux installs into ~/.linuxbrew without touching the
        host. Useful for languages and tools that move faster than Fedora
        repos (e.g. starship, zellij, lazygit). Not a substitute for the
        toolbox; complementary.
    starship:
      install: user-binary
      url: https://github.com/starship/starship/releases/latest/download/starship-x86_64-unknown-linux-gnu.tar.gz
      install_path: ~/.local/bin/starship
      note: Single-binary prompt; can also come from brew if installed

gnome:
  note: >
    GNOME is Lucciola's stock fallback session (2026-10-18). The sections
    that described Margine's GNOME (settings, extensions, workspaces,
    keybindings, app folders) went with the configure-gnome-* helpers
    that applied them; Margine OS keeps them in its own declarations.
    What stays is what the remaining helpers read.
  default_applications:
    note: >
      Applied by scripts/configure-default-applications. Sets MIME
      type and URL scheme handlers via xdg-mime and xdg-settings so
      GNOME Settings → Default Applications shows the intended app
      for every role, and "Open with" dialogs default correctly.
    web_browser: app.zen_browser.zen.desktop
    mail_reader: org.mozilla.thunderbird_esr.desktop
    calendar: org.gnome.Calendar.desktop
    music_player: com.github.neithern.g4music.desktop
    video_player: org.gnome.Showtime.desktop
    image_viewer: org.gnome.Loupe.desktop
    pdf_viewer: org.gnome.Papers.desktop
    text_editor: org.gnome.TextEditor.desktop
    archive_manager: org.gnome.FileRoller.desktop
    terminal_emulator: org.gnome.Ptyxis.desktop

home:
  roots:
    - data
    - dev
    - scratch
  xdg_user_dirs:
    DESKTOP: "$HOME/"
    DOWNLOAD: "$HOME/scratch/downloads"
    TEMPLATES: "$HOME/data/templates"
    PUBLICSHARE: "$HOME/data/shared"
    DOCUMENTS: "$HOME/data/personal"
    MUSIC: "$HOME/data/media/audio"
    PICTURES: "$HOME/data/media/photos"
    VIDEOS: "$HOME/data/media/video"
    PROJECTS: "$HOME/data/projects"
  bookmarks:
    - path: "$HOME/data/personal"
      label: Documents
    - path: "$HOME/scratch/downloads"
      label: Downloads
    - path: "$HOME/data/media/photos"
      label: Pictures
    - path: "$HOME/data/media/audio"
      label: Music
    - path: "$HOME/data/media/video"
      label: Videos
    - path: "$HOME/data/shared"
      label: Shared
    - path: "$HOME/data/projects"
      label: Projects
    - path: "$HOME/dev"
      label: Development
    - path: "$HOME/scratch"
      label: Scratch
  folder_icons:
    mechanism: gio-metadata
    require_existing_icon_files: true
    prefer_scalable_svg: true
    raster_fallback: false

hardware_media:
  policy:
    default_gpu_vendors:
      - intel-open
      - amd-open
    nvidia_default: false
    rpmfusion_codec_replacement_default: true
    resolve_default: false
    gaming_split_lock_override_default: false
  validation:
    require_pipewire: true
    require_wireplumber: true
    validate_opengl: true
    validate_vulkan: true
    validate_vaapi: true
    validate_opencl_when_declared: true
    validate_rocm_when_declared: true
  application_channels:
    creative_gui_default: flatpak
    gaming_default: flatpak-optional
    host_drivers: rpm-ostree-or-image
  framework13_audio:
    enabled_by_default: false
    requires_dmi_match: true
    target_output: internal-speakers-only
    resolve_sink_at_runtime: true
    channel_decision_required:
      - rpm-easyeffects
      - flatpak-easyeffects

gaming_runtime:
  policy:
    target_profile: true
    enable_after_hardware_media_validation: true
    bazzite_rebase_default: false
    steam_gaming_mode_default: false
    split_lock_override_default: false
    nvidia_gaming_default: false
    default_image_includes_gaming: false  # opt-in via `ujust margine-gaming`
  opt_in:
    # Two variants, both opt-in, both reversible. Pick by use case.
    default:
      command: ujust margine-gaming
      rollback_command: ujust margine-gaming-remove
      delivery: flatpak_for_launchers_plus_rpm_for_gamescope_vkbasalt
      good_for: occasional gaming, no rpm-ostree upgrade overhead
    native:
      command: ujust margine-gaming-native
      rollback_command: ujust margine-gaming-native-remove
      delivery: rpm_for_steam_lutris_retroarch_plus_flatpak_for_the_rest
      good_for: anti-cheat (EAC/BattlEye), VR, Steam Link, NVIDIA + Mesa-git side-by-side
      cost: +30-60s per bootc upgrade to re-apply the layer
      added_on: 2026-06-07
    recipe_file: /usr/share/ublue-os/just/99-margine.just
    source_in_image_repo: build_files/99-margine.just
    inspired_by: >
      Bazzite (ublue-os/bazzite). Margine ships a SINGLE image
      `margine:stable` and reaches the gaming stack via the opt-in
      `ujust margine-gaming` recipe (Margine Gaming OCI variant was
      retired 2026-06-06). The base creator tier already carries
      scx-scheds + mangohud + goverlay + steam-devices (see
      host_packages.baseline.creator_tier above, promoted on
      2026-06-03/05); the ujust layer only adds gamescope + vkBasalt
      on top, plus the Flatpak gaming launchers. No umu-launcher
      (complex packaging), no Bazzite KDE/Deck-specific bits.
      A second variant `ujust margine-gaming-native` (added 2026-06-07)
      layers Steam + Lutris + RetroArch as native RPMs for users
      needing maximum Proton/Wine compatibility — same trade-off
      RakuOS chose with its "Native Gaming. Not Flatpak." stance,
      but kept here as an opt-in second path so the default Margine
      experience stays upgrade-friendly.
  layers:
    desktop_runtime:
      apps_channel: flatpak
      host_helpers_channel: rpm-ostree-via-ujust
    flatpak_launchers_opt_in:
      - com.valvesoftware.Steam
      - net.lutris.Lutris
      - com.heroicgameslauncher.hgl
      - com.usebottles.bottles
      - com.github.Matoking.protontricks
      - com.vysp3r.ProtonPlus
    rpm_host_helpers_opt_in:
      # ONLY packages specific to the gaming variant. Everything else
      # (mangohud, goverlay, steam-devices, scx-scheds) has been promoted
      # to the base image's host_packages.baseline.creator_tier section.
      # gamemode is inherited from Bluefin DX itself, not added here.
      - gamescope
      - vkBasalt
    gaming_mode_session:
      phase: future-image-or-bootc
      requires:
        - desktop-runtime-validation
        - gamescope-session-design
        - controller-input-validation
        - rollback-test
        - secure-boot-tpm2-retest
  validation:
    require_vulkan_before_launchers: true
    inspect_vulkan_layers: true
    inspect_flatpak_permissions: true
    validate_split_lock_not_disabled_by_default: true
    validate_rpm_ostree_status: true

ai_workflow:
  # Optional local-LLM workflow. Added 2026-06-07 in response to the
  # Red Hat / Fedora "make AI boring" push (RamaLama containerised
  # local-LLM serving) and the broader 2026 trend of locally-hosted,
  # privacy-friendly LLMs replacing some SaaS-only workflows for
  # writers / coders / creators (Margine's ICP).
  default_image_includes_ai: false  # opt-in via `ujust margine-ai`
  opt_in:
    command: ujust margine-ai
    rollback_command: ujust margine-ai-remove
    recipe_file: /usr/share/ublue-os/just/99-margine.just
    source_in_image_repo: build_files/60-custom.just
    gui:
      flatpak_id: com.jeffser.Alpaca
      backend: ollama_bundled_in_flatpak_runtime
      what_it_does: >
        GUI chat with local LLMs. Alpaca ships its own Ollama backend
        inside the Flatpak runtime, so no host install and no daemon
        to run. Pick a model from inside the app on first launch —
        Alpaca handles the download.
    cli_pointer:
      tool: ramalama
      not_installed_by_recipe: true
      why: >
        RamaLama is Red Hat's CLI runner for local LLMs in rootless
        containers (Podman + --network=none default). Installing it
        host-side would add another layered RPM; instead the recipe
        prints distrobox setup commands so power users keep their
        host minimal.
      pointer: >
        distrobox create --image fedora:42 --name ai &&
        distrobox enter ai && sudo dnf install -y ramalama
    recommended_starter_models:
      - llama3.1:8b      # general purpose, ~5 GB, fits 8 GB GPU
      - qwen2.5-coder:7b # coding-focused, ~4 GB
      - mistral:7b       # fast general, ~4 GB
      - phi3.5:3.8b      # small footprint, ~2 GB, CPU-friendly
    hardware_floor:
      vram_comfortable_gb: 8
      ram_minimum_gb_for_cpu_only: 16
  validation:
    inspect_flatpak_permissions: true
    network_isolated_for_ramalama: true  # --network=none default

