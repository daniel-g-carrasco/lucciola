name: Lint

# Fast static gate (~1 min) in front of the 25-minute image build.
# Born from the 2026-06-12 code-quality review: that week's two real
# bugs lived in a just-recipe body and a workflow expression — places
# no existing check was looking at. actionlint covers workflow files
# (including shellcheck over run: blocks); the shellcheck step covers
# build scripts AND the extensionless bash shipped into the image under
# build_files/system_files (which an extension-glob lint never saw).

on:
  pull_request:
    # labeled/unlabeled besides the defaults: the build-inputs-need-vm-test
    # job below judges the vm-test label, so a label change must re-run it.
    # No path filter: this workflow's jobs are the required checks, and a
    # required check that does not run blocks the merge forever.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint (workflows, incl. shellcheck on run blocks)
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        env:
          # Gate on warnings and above. The info/style tail (quote
          # $GITHUB_OUTPUT, SC2129 grouped redirects) is tracked for the
          # phase-3 inline-bash extraction, not worth failing builds on.
          SHELLCHECK_OPTS: --severity=warning
        with:
          args: -color

      - name: Workflow jobs cannot be skipped by accident
        # A job with the implicit success() condition is skipped when ANY
        # job upstream was skipped. That silently stopped image signing on
        # main on 2026-10-06; actionlint does not see it.
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          python3 .github/scripts/check-job-conditions.py .github/workflows/*.yml

      - name: hadolint (Containerfile)
        # Lints the bootc ./Containerfile (the only one since the plan B
        # Containerfile went with the base switch of 2026-10-11). Rules and
        # the warning-level failure threshold live in .hadolint.yaml so a
        # local `hadolint Containerfile` matches CI. SHA-pinned like every
        # other action here.
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Containerfile
          config: .hadolint.yaml

      - name: Flatpak fix invariants (regression guard)
        # Static guard for the 2026-06 Flatpak fixes (forum 12247) that no
        # boot test exercises. The live ISO's checks left with the ISO
        # tooling (docs/history/margine/live-env, 2026-10-20).
        run: .github/scripts/check-flatpak-fixes.sh

      - name: GUI icon names must exist
        # GTK draws a broken-image placeholder for a missing icon name
        # instead of failing, so invented names ship silently (they did:
        # os-symbolic / processor-symbolic / emblem-ok-symbolic).
        run: .github/scripts/check-gui-icon-names.sh

      - name: shellcheck (tracked *.sh + shebang-discovered system_files)
        # -S warning: the only info-level items are SC1091 ("can't
        # follow /ctx/00-common.sh") — a build-container path that does
        # not exist at lint time, structurally unfixable here.
        run: |
          set -euo pipefail
          mapfile -t SH < <(git ls-files '*.sh' | grep -v '^docs/history/')
          mapfile -t BIN < <(git grep -lE '^#!.*\b(ba)?sh\b' -- build_files/system_files lucciola/system_files | grep -v '\.sh$' || true)
          printf 'shellcheck over %d scripts\n' "$(( ${#SH[@]} + ${#BIN[@]} ))"
          shellcheck -S warning "${SH[@]}" "${BIN[@]}"

      - name: dock-dp-rescue gates (fake sysfs, no hardware)
        # The helper rebinds a kernel driver on plug-in: what it must NOT
        # act on (charger, expansion card, healthy dock) is tested, not
        # assumed. See tests/dock-dp-rescue.test.sh.
        run: bash tests/dock-dp-rescue.test.sh

      - name: Image security scanner
        # What the scanner calls a secret, a drift or clean is tested on a
        # throwaway rootfs, including the root adb key of 2026-10.
        run: bash tests/scan-image-security.test.sh

      - name: MOK enrollment helper
        # Enrolls the Margine key with Secure Boot on OR off, every boot
        # until shim has it: the one-shot version left systems installed
        # with Secure Boot off unable to ever turn it on (2026-10-04).
        run: bash tests/mok-enroll.test.sh

      - name: GRUB menu lock helper
        # Writes the bootloader's password file: what it accepts, refuses
        # and removes is tested, not assumed. See tests/grub-lock.test.sh.
        run: bash tests/grub-lock.test.sh

      - name: Autologin helper (greetd and GDM)
        # Edits the login screen's configuration as root: which accounts it
        # refuses, and that greetd's file keeps every other line and still
        # parses, is tested on temp files. See tests/lucciola-autologin.test.sh.
        run: bash tests/lucciola-autologin.test.sh

      - name: Login screen migration helper (GDM to greetd)
        # Runs once on every installed system before the display manager
        # starts: what it switches, what it leaves alone and when it retries
        # is tested. See tests/login-migrate.test.sh.
        run: bash tests/login-migrate.test.sh

      - name: Login screen look (Noctalia Greeter)
        # The greeter uses greeter.toml's colours, font and corners only
        # with a complete palette, and installed systems get the look only
        # through that file: what it must hold, and that the wallpaper SVGs
        # are what make-wallpaper.py writes, is tested.
        # See tests/greeter-look.test.sh.
        run: bash tests/greeter-look.test.sh

      - name: Default account picture helper
        # Writes AccountsService's files as root at every boot: which
        # accounts get the firefly and that a picture someone chose (or
        # removed) is never touched, is tested. See tests/default-avatar.test.sh.
        run: bash tests/default-avatar.test.sh

      - name: Welcome window at the first login
        # session-start opens it for new users until it is closed once, and
        # never for accounts that had Lucciola sessions before it existed.
        # See tests/session-start-welcome.test.sh.
        run: bash tests/session-start-welcome.test.sh

      - name: Lucciola System without a display
        # The toolkit-free module (which image is followed, what rpm-ostree
        # says, how pending updates are worded), the privileged helper's
        # argument checks and its polkit policy (one action per verb,
        # matched on path and first argument), and the window's script:
        # compiles, no long dashes, no terminal commands in its strings.
        # See tests/system-logic.test.sh.
        run: |
          sudo apt-get install -y -qq --no-install-recommends libxml2-utils >/dev/null 2>&1 || true
          bash tests/system-logic.test.sh
      - name: Keep Awake holds sleep, and the lid locks the session
        # The two modes of /usr/libexec/lucciola/keep-awake (what the
        # inhibitor holds, the two-hour default with --screen), on again,
        # schedule and cancel, and the lid watcher: a closed lid locks the
        # session and holds power-saver unless another monitor is on, an
        # opened lid gives the profile back; on fake systemd-run, gdbus and
        # niri. See tests/keep-awake.test.sh.
        run: bash tests/keep-awake.test.sh
      - name: Apps take the Noctalia palette, Flatpak ones included
        # lucciola-flatpak-theme-access asks Flatpak for read-only access to
        # the GTK folders and kdeglobals and for Qt's KDE theme, nothing more;
        # lucciola-app-colors-flatpak carries the Zen and Vesktop community
        # templates into those Flatpaks, idempotent, never with
        # devtools.chrome.enabled. See tests/app-colors.test.sh.
        run: bash tests/app-colors.test.sh
      - name: Gaming alignment takes a new view of the repositories
        # build_files/custom-kernel/gaming-align.sh on a fake dnf: a view that
        # names a build no mirror holds is thrown away and planned again on
        # fresh metadata (expat-2.8.5, 2026-10-21); a layer that does not
        # resolve stops at once; only x86_64 and noarch replacements are
        # aligned, never the i686 chain. See tests/gaming-align.test.sh.
        run: bash tests/gaming-align.test.sh

      - name: Stale LD_PRELOAD guard
        # The user environment generator drops LD_PRELOAD entries whose
        # library is gone (Margine's Wayland Scroll Factor line after a move).
        run: bash tests/drop-missing-preload.test.sh

      - name: Stock-Fedora Flatpak remotes tidy
        # The fedora remotes a Silverblue/Kinoite start leaves behind go,
        # unless apps came from them. See tests/flatpak-remote-tidy.test.sh.
        run: bash tests/flatpak-remote-tidy.test.sh

      - name: Developer layer helper (ujust lucciola-devmode)
        # Reads the package list, picks what remove may drop, installs and
        # deletes Homebrew: tested on temp files with a fake installer.
        # The repository step runs for real in build.yml's resolve check.
        run: bash tests/devmode.test.sh

      - name: Third-party RPM trust (pinned key only, signature checks on)
        # rpm-trust, shared by the build and layer-repo: a key file with any
        # primary key besides the pinned one, and a repository file that turns
        # signature checking off in any section, are refused; legitimate ones
        # come out with the pinned key alone. See tests/rpm-trust.test.sh.
        run: bash tests/rpm-trust.test.sh

      - name: Checks report the command, not the tail of its output
        # A shell without pipefail reports `rpm-ostree ... | tail` as tail's
        # success: upgrade-smoke's guest commands and the baseline package
        # check are run with stubs that fail after ordinary output, and
        # with missing inputs. See tests/pipeline-status.test.sh.
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          bash tests/pipeline-status.test.sh

      - name: The base the image is built on is the base its labels name
        # build.yml resolves the base to a digest once and builds FROM it;
        # the base.digest label, base-watch and the kernel reserve read that
        # digest. See tests/resolve-base.test.sh.
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          bash tests/resolve-base.test.sh

      - name: Margine's ISO tooling stays archived
        # live-env/, tools/iso-builder and tools/bench built and tested
        # Margine; they live in docs/history/margine/ and nothing that runs
        # may point at them. See tests/retired-iso-tooling.test.sh.
        run: bash tests/retired-iso-tooling.test.sh

      - name: Welcome window texts
        # The window draws content.json as it finds it: a missing field, an
        # unknown button action or a long dash is caught here, in words.
        run: python3 tools/content-editor/welcome_content.py

      - name: Content editor
        # Saving the website must change only what was edited (a save
        # without edits is byte-identical); the welcome data check must
        # refuse what the window cannot draw. See tests/content-editor.test.sh.
        run: bash tests/content-editor.test.sh

      - name: Signed transport migration helper
        # Moves unverified installs to ostree-image-signed:. What it leaves
        # alone (other images, no policy, failed verification) is tested.
        run: bash tests/signed-origin.test.sh

      - name: User-session staleness check
        run: bash tests/staleness.test.sh

      - name: Kernel switch helper (CachyOS kernel and Fedora's)
        # Moves an install between :stable and the kernel reserve: what it
        # refuses (no x86-64-v3, Secure Boot without the key, other images,
        # pins) and that it warns about TPM unlock first, is tested.
        run: bash tests/kernel-switch.test.sh

      - name: Pinned Fedora build (the repositories, then Koji)
        # Noctalia and the kernel reserve's kernel-devel are pinned to a
        # build the repositories drop. From where each is installed, that
        # Koji's copy is checked against the release key before dnf sees
        # it, and what refuses (bad signature, another key, a 404) is
        # tested with fake dnf5, curl and rpmkeys.
        run: bash tests/pinned-fedora-build.test.sh

      - name: MOK key only in the signing stage
        # The private key is mounted in one RUN, the mok-sign stage's: FROM
        # the clean base, no network, the signer alone. Package installs and
        # build steps never see it (review N1). See tests/mok-secret-scope.test.sh.
        run: bash tests/mok-secret-scope.test.sh

      - name: MOK signer and the step that installs its output
        # Module signatures as the kernel reads them, vmlinuz via
        # systemd-sbsign, refused paths (links to the key included), and
        # finalize.sh refusing files that changed after signing.
        # The runner ships no systemd-sbsign and keeps its kernel image
        # root-only, so the tool comes from systemd-repart and systemd-boot's
        # EFI binary stands in for vmlinuz; MOK_TEST_REQUIRE_PE turns the
        # test's skip into a failure, so the vmlinuz path is always run here
        # (the first run after review N1 skipped it and failed on the
        # install step instead, 2026-10-20). See tests/mok-sign.test.sh.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends systemd-repart systemd-boot-efi sbsigntool
          TEST_PE=/usr/lib/systemd/boot/efi/systemd-bootx64.efi MOK_TEST_REQUIRE_PE=1 bash tests/mok-sign.test.sh

      - name: scrcpy pin from upstream's signed checksums
        # SCRCPY_SHA256 comes from SHA256SUMS.txt signed by the maintainer's
        # pinned key, never from hashing the download (review N2).
        # See tests/scrcpy-signed-sha.test.sh.
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          bash tests/scrcpy-signed-sha.test.sh

      - name: Security scan and SBOM read the image that ships
        # The chunked image, whose config the push checks, not the one
        # before chunking (review N3). See tests/scan-what-ships.test.sh.
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          bash tests/scan-what-ships.test.sh

      - name: Components installed outside RPM reach the SBOM
        # scrcpy and the other downloads the build unpacks are recorded in
        # the image and merged into the published SBOM, checked against the
        # files (review N9). See tests/sbom-components.test.sh.
        run: bash tests/sbom-components.test.sh

      - name: Flatpak repair gate (flatpak-preinstall.service)
        # Relabel and repair run on a first boot, after a failed run or on a
        # broken repo, once per boot at most, and never on a settled boot.
        # See tests/flatpak-repo-repair.test.sh.
        run: bash tests/flatpak-repo-repair.test.sh

      - name: Shipped public key is the signing key
        # Devices verify against the copy in system_files; CI signs with the
        # private half of secrets/cosign.pub. If they ever differ, every
        # update on every device fails verification.
        run: cmp secrets/cosign.pub build_files/system_files/usr/lib/pki/containers/margine.pub

      - name: ruff (python build helpers)
        # Pinned: an unpinned `pipx run ruff` broke every PR when 0.16.0
        # widened the default rules (2026-07-23). Rules are locked in
        # ruff.toml; the pin keeps the runner reproducible too.
        run: |
          set -euo pipefail
          mapfile -t PY < <(git ls-files '*.py' | grep -v '^docs/history/')
          pipx run ruff==0.16.0 check "${PY[@]}"

      - name: just syntax (60-custom.just + Justfile parse)
        # rust-just on PyPI ships the `just` binary; pipx is
        # preinstalled on GitHub runners — no apt dependency.
        run: |
          set -euo pipefail
          pipx run --spec rust-just just --summary --justfile build_files/60-custom.just >/dev/null
          echo "60-custom.just OK"
          pipx run --spec rust-just just --summary >/dev/null
          echo "Justfile OK"

  flatpak-preinstall:
    # The real `flatpak preinstall` (Flatpak 1.16 or later) against a local
    # repository of test apps: an app that leaves the default set must stay
    # installed (2026-10-18), a removed default must stay removed. Fedora,
    # as in the image, and a job of its own so the static gate stays fast.
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:e0f7c9b6ed4f631ac8d0261f7543c3646d148be46a94d60b9465b73c7d4e1500
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Flatpak preinstall keeps apps that leave the default set
        env:
          FLATPAK_TEST_REQUIRED: "1"
        run: |
          set -euo pipefail
          # Fedora's mirrors answer 503 now and then (updates-testing on
          # 2026-10-20): three attempts, then the packages must be there.
          for i in 1 2 3; do
            dnf -y -q install flatpak ostree python3 && break
            echo "dnf attempt $i failed, retrying in 30 s"; sleep 30
          done
          rpm -q flatpak ostree python3
          bash tests/flatpak-preinstall-keep.test.sh

  build-inputs-need-vm-test:
    # A pull request that changes what the image is built from (the
    # Containerfile, build_files, lucciola, the build workflow, the
    # validators, the security baseline, the disk layouts) must carry the
    # vm-test label, so build.yml builds and boot-tests it as :pr-N before it
    # merges; without the label nothing builds it, and such changes reached
    # main unbuilt more than once. Fails in plain words until the label is
    # there (label events re-run it); passes for every other pull request.
    # Required check (tools/repo-guard.sh): no name:, no path filter.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build inputs changed without the vm-test label?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/build-inputs-need-vm-test.py \
            --repo "${{ github.repository }}" --pr "${{ github.event.pull_request.number }}"

  policy:
    # The repository's rules about itself, read from tests/policy/ and
    # docs/SECURITY-CLAIMS.md: what the checks below enforce is written down
    # as data, so a change to a rule is a reviewable diff, and the checkers
    # are tested on fixtures before they judge the tree. A job of its own,
    # always run, no path filter: a required check (tools/repo-guard.sh).
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: PyYAML (the checkers read the workflows)
        run: python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml

      - name: The mutation checker (fixtures)
        # Killed, survived and broken verdicts on a throwaway repository, and
        # the system PATH first. See tests/mutation-check.test.sh.
        run: bash tests/mutation-check.test.sh

      - name: Every mutant still applies
        # A guard that moved leaves its mutant without an anchor: caught here,
        # on every pull request, not at the weekly run (mutation.yml).
        run: python3 .github/scripts/mutation-check.py --check

      - name: The vm-test gate (fixtures and wiring)
        # Which paths are build inputs, the words of the failure, and that
        # lint.yml, build.yml and Renovate agree with it. See
        # tests/vm-test-gate.test.sh.
        run: bash tests/vm-test-gate.test.sh

      - name: The claims-register lint (fixtures)
        # A verified claim naming only words, a dangling path, an orphan
        # test: each caught on a throwaway tree. See tests/check-claims.test.sh.
        run: bash tests/check-claims.test.sh

      - name: Every verified claim names its proof; no orphan test
        # docs/SECURITY-CLAIMS.md: a row marked verified or partial names a
        # test, script or workflow step that exists; every test under tests/
        # is run by lint.yml or mutation.yml. See .github/scripts/check-claims.py.
        run: python3 .github/scripts/check-claims.py

      - name: Branch protection as code (fixtures)
        # tools/repo-guard.sh against recorded states, apply through a fake
        # gh, and its required checks equal to this workflow's always-running
        # jobs. See tests/repo-guard.test.sh.
        run: bash tests/repo-guard.test.sh

      - name: The strict-mode lint (fixtures)
        # Which `set` forms count, which do not, and the allowlist's own
        # rules (a reason, an existing file, a script still not strict).
        # See tests/strict-mode.test.sh.
        run: bash tests/strict-mode.test.sh

      - name: Shell scripts run in strict mode, or say why not
        # set -euo pipefail in the first 30 lines of every shell script under
        # build_files, lucciola, .github/scripts, .github/smoke and tests, or
        # an entry with a reason in tests/policy/strict-mode-allowlist.txt.
        # See .github/scripts/check-strict-mode.py.
        run: python3 .github/scripts/check-strict-mode.py

      - name: The package-removal guard (fixtures and wiring)
        # An unexpected removal fails a main build, an expected one is dated
        # and expires, additions are reported; build.yml runs it on the built
        # image before chunking. See tests/package-removal-guard.test.sh.
        run: bash tests/package-removal-guard.test.sh

      - name: The weekly upgrade matrix
        # The cells upgrade-matrix.py prints (dispatch inputs, the weekly
        # starting points, steam only once :stable is promoted) and the
        # workflow's wiring: one VM at a time, logs per cell, ntfy with the
        # cell's name. See tests/upgrade-matrix.test.sh.
        run: bash tests/upgrade-matrix.test.sh
      - name: The upgrade smoke names failed units safely and dumps their journal
        run: bash tests/upgrade-smoke-units.test.sh

      - name: The secret-scope checker (fixtures)
        # A secret on the wrong stage or without --network=none, a job off
        # the allowlist, an action between staging and the build, a late
        # wipe: each caught on fixtures. See tests/secret-scope.test.sh.
        run: bash tests/secret-scope.test.sh

      # Last on purpose: red until the mok-sign stage lands (pull request
      # #30), and the verdicts above must stay readable meanwhile.
      - name: Build secrets only where tests/policy allows
        # The MOK key on the mok-sign stage's RUN alone, with no network;
        # secrets.MOK_* and secrets.COSIGN* in the listed jobs alone, staged
        # right before the build and wiped right after it, no action in
        # between (review N1). See .github/scripts/check-secret-scope.py.
        run: python3 .github/scripts/check-secret-scope.py
