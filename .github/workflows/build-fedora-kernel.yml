---
# The kernel reserve: Lucciola with Fedora's own kernel instead of the
# CachyOS one, published as ghcr.io/daniel-g-carrasco/lucciola:fedora-kernel
# (the name lives in one place: build_files/system_files/usr/share/margine/
# kernel-reserve-tag, line 1).
#
# Why (2026-10-18): a bootc image carries one kernel (bootc container lint
# refuses two), so the way back from a CachyOS kernel that breaks, or the
# way forward while the CachyOS COPR is down, has to be a second image. It
# is also the image for CPUs without x86-64-v3, which kernel-cachyos is
# built for (CONFIG_X86_64_VERSION=3); Fedora's kernel is generic x86-64.
# Users move between the two with `ujust lucciola-kernel fedora|cachyos`.
#
# What it builds: the commit and the base digest of the current :stable,
# read from :stable's own labels (org.opencontainers.image.revision,
# .base.name, .base.digest), with --build-arg KERNEL_FLAVOR=fedora. The
# two images differ in the kernel and what is built against it; chunked
# the same way they share the other layers, so a switch downloads little.
#
# When:
#   - after every smoke-boot run on main (workflow_run) and every six hours
#     (schedule): resolve asks the registry whether :stable moved since the
#     reserve was built (the reserve carries dev.margine.reserve-of, the
#     :stable digest it was built for) and builds only then, so a failed
#     run is retried by the next tick. The schedule catches the promotions
#     workflow_run never reports: a smoke-boot that base-watch.yml starts
#     with GITHUB_TOKEN fires no workflow_run (GitHub's recursion guard).
#     Both stay off while the repository variable LUCCIOLA_PROMOTE_STABLE
#     is not 'true': no :stable, no reserve.
#   - workflow_dispatch: a TEST build of the dispatched ref against the
#     Containerfile's base, published as :<tag>-test only. It never moves
#     the public tag (there is no input that would).
#
# Jobs: resolve -> build_push (build, the shipped validators, kernel proof,
# chunk, then security scan and SBOM of the chunked image, push the staging
# tag) -> sign (build.yml's sign job: cosign bundle + classic signature,
# SBOM attached and signed)
# -> smoke (smoke-boot.yml's QEMU boot with Secure Boot, TPM and its
# gates, the signature check, then the public tag moves on public runs)
# -> notify.
#
# The main path is not touched: this workflow reads :stable and never
# writes it, shares no concurrency group with build.yml or smoke-boot.yml
# (it can neither cancel them nor queue behind them), and every job after
# resolve names its status (!cancelled() && needs.<job>.result ==
# 'success'): a skipped job upstream cannot silently skip the signature,
# which is how two unsigned images reached :stable on 2026-10-06.
name: Build kernel reserve (Fedora kernel)

on:
  workflow_run:
    workflows: ["Smoke-boot published image"]
    types: [completed]
    branches: [main]
  schedule:
    # 02:13, 08:13, 14:13, 20:13 UTC: about two hours after each base-watch
    # tick (:23 every six hours), when a build it started has been promoted.
    - cron: '13 2-23/6 * * *'
  workflow_dispatch:

permissions: {}

# Public runs queue (never cancel: a cancelled run mid-push could leave the
# public tags on two digests); a test run has its own group, so it cannot
# replace a public run waiting in the queue.
concurrency:
  group: kernel-reserve-${{ github.event_name == 'workflow_dispatch' && 'test' || 'public' }}
  cancel-in-progress: false

env:
  IMAGE_NAME: lucciola
  IMAGE_DESC: "Lucciola kernel reserve: niri with the Noctalia shell on Fedora Silverblue (Universal Blue main), Fedora's own kernel instead of the CachyOS one"
  IMAGE_KEYWORDS: "bootc,ublue,silverblue,fedora-kernel,niri,noctalia,lucciola"
  TAG_FILE: build_files/system_files/usr/share/margine/kernel-reserve-tag

jobs:
  resolve:
    name: What to build (the current :stable, or a test)
    if: >-
      github.event_name == 'workflow_dispatch'
      || (vars.LUCCIOLA_PROMOTE_STABLE == 'true'
          && (github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      build: ${{ steps.r.outputs.build }}
      public: ${{ steps.r.outputs.public }}
      ref: ${{ steps.r.outputs.ref }}
      base: ${{ steps.r.outputs.base }}
      base_name: ${{ steps.r.outputs.base_name }}
      base_digest: ${{ steps.r.outputs.base_digest }}
      stable_digest: ${{ steps.r.outputs.stable_digest }}
      tag: ${{ steps.r.outputs.tag }}
      push_tag: ${{ steps.r.outputs.push_tag }}
      version: ${{ steps.r.outputs.version }}
      ymd: ${{ steps.r.outputs.ymd }}
      created: ${{ steps.r.outputs.created }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve the commit, the base and the tags
        id: r
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          REPO_IMG: ghcr.io/${{ github.repository_owner }}/lucciola
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }
          echo "$GH_TOKEN" | skopeo login ghcr.io -u "$GH_ACTOR" --password-stdin >/dev/null
          TAG="$(head -n1 "$TAG_FILE" | tr -d '[:space:]')"
          [[ "$TAG" =~ ^[a-z0-9][a-z0-9._-]*$ ]] || { echo "::error::no valid tag on line 1 of $TAG_FILE"; exit 1; }
          YMD="$(date -u +%Y%m%d)"
          if [ "$EVENT" = workflow_dispatch ]; then
            # Test: this ref, the Containerfile's base as it is now.
            REF="$SHA"; PUBLIC=false; PUSH_TAG="${TAG}-test"; STABLE_DIGEST=""
            BASE_NAME="$(sed -nE 's/^ARG BASE_IMAGE=(.*)$/\1/p' Containerfile | head -1)"
            BASE_DIGEST="$(skopeo inspect --no-tags "docker://${BASE_NAME}" --format '{{.Digest}}')"
            VERSION="${PUSH_TAG}.${YMD}"
          else
            if ! RAW="$(skopeo inspect --retry-times 3 --no-tags "docker://${REPO_IMG}:stable" 2>&1)"; then
              # A registry blip: the next tick retries, and stale-image-alarm
              # reports a reserve that falls behind.
              echo "::warning::cannot inspect ${REPO_IMG}:stable, nothing built: ${RAW##*$'\n'}"
              echo "build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            STABLE_DIGEST="$(jq -r '.Digest' <<<"$RAW")"
            REF="$(jq -r '.Labels["org.opencontainers.image.revision"] // empty' <<<"$RAW")"
            BASE_NAME="$(jq -r '.Labels["org.opencontainers.image.base.name"] // empty' <<<"$RAW")"
            BASE_DIGEST="$(jq -r '.Labels["org.opencontainers.image.base.digest"] // empty' <<<"$RAW")"
            [[ "$REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error:::stable ($STABLE_DIGEST) has no commit in org.opencontainers.image.revision"; exit 1; }
            [ -n "$BASE_NAME" ] || { echo "::error:::stable ($STABLE_DIGEST) has no org.opencontainers.image.base.name"; exit 1; }
            BUILT_FOR="$(skopeo inspect --retry-times 3 --no-tags "docker://${REPO_IMG}:${TAG}" 2>/dev/null \
                         | jq -r '.Labels["dev.margine.reserve-of"] // empty' || true)"
            if [ "$BUILT_FOR" = "$STABLE_DIGEST" ]; then
              echo "::notice:::${TAG} is already built for :stable ${STABLE_DIGEST}: nothing to do"
              echo "build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -z "$BASE_DIGEST" ]; then
              # build.yml resolves the base digest best-effort; without it
              # "the same base" cannot be honoured, the current one is next best.
              BASE_DIGEST="$(skopeo inspect --no-tags "docker://${BASE_NAME}" --format '{{.Digest}}')"
              echo "::warning:::stable carries no base.digest label: building on the current ${BASE_NAME} (${BASE_DIGEST})"
            fi
            PUBLIC=true; PUSH_TAG="${TAG}-candidate"; VERSION="${TAG}.${YMD}"
          fi
          [[ "$BASE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest for the base ${BASE_NAME}"; exit 1; }
          # FROM by digest: the tag (":45") is dropped, the digest decides.
          LAST="${BASE_NAME##*/}"
          BASE_REPO="$BASE_NAME"
          [[ "$LAST" == *:* ]] && BASE_REPO="${BASE_NAME%:*}"
          {
            echo "build=true"
            echo "public=$PUBLIC"
            echo "ref=$REF"
            echo "base=${BASE_REPO}@${BASE_DIGEST}"
            echo "base_name=$BASE_NAME"
            echo "base_digest=$BASE_DIGEST"
            echo "stable_digest=$STABLE_DIGEST"
            echo "tag=$TAG"
            echo "push_tag=$PUSH_TAG"
            echo "version=$VERSION"
            echo "ymd=$YMD"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Kernel reserve"
            echo "- event: \`$EVENT\` (public: $PUBLIC)"
            echo "- commit: \`$REF\`"
            echo "- base: \`${BASE_REPO}@${BASE_DIGEST}\`"
            [ -z "$STABLE_DIGEST" ] || echo "- for :stable \`$STABLE_DIGEST\`"
            echo "- pushed as \`:${PUSH_TAG}\`$([ "$PUBLIC" = true ] && echo ", then \`:${TAG}\` and \`:${TAG}.${YMD}\` after the boot test")"
          } >> "$GITHUB_STEP_SUMMARY"

  build_push:
    name: Build + check + chunk + push
    needs: resolve
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.resolve.outputs.build == 'true' }}
    runs-on: ubuntu-26.04
    # Same budget and the same work as build.yml's build_push.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image_ref: ${{ steps.push.outputs.image_ref }}
      kver: ${{ steps.kernel.outputs.kver }}
    env:
      SRC: localhost/lucciola:reserve-build
    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # v10

      - name: Checkout the commit to build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: The commit knows the kernel reserve
        # A :stable built before KERNEL_FLAVOR existed would ignore the build
        # argument and produce a second CachyOS image under the reserve's name.
        run: |
          grep -q '^ARG KERNEL_FLAVOR=' Containerfile \
            || { echo "::error::${{ needs.resolve.outputs.ref }} predates KERNEL_FLAVOR: no reserve can be built from it"; exit 1; }

      - name: Harden podman storage (rpmdb corruption guard, as in build.yml)
        run: |
          set -euo pipefail
          conf=/etc/containers/storage.conf
          if [ ! -f "$conf" ]; then
            echo "no $conf: podman is using its defaults, nothing to harden"
            exit 0
          fi
          sudo sed -i -E 's|^(\s*mount_program\s*=)|# \1|' "$conf"
          sudo sed -i -E 's/,fsync=0//; s/fsync=0,//; s/"fsync=0"/""/' "$conf"
          if podman info --format '{{.Store.GraphOptions}}' | grep -q mount_program; then
            echo "::error::podman still uses a userspace mount_program"
            exit 1
          fi

      - name: Pre-build login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Stage MOK secrets for BuildKit
        env:
          MOK_KEY: ${{ secrets.MOK_KEY }}
          MOK_CERT: ${{ secrets.MOK_CERT }}
        run: |
          mkdir -p /tmp/margine-secrets
          chmod 700 /tmp/margine-secrets
          printf '%s' "$MOK_KEY"  > /tmp/margine-secrets/MOK.key
          printf '%s' "$MOK_CERT" > /tmp/margine-secrets/MOK.pem
          chmod 600 /tmp/margine-secrets/*

      - name: Build the image (KERNEL_FLAVOR=fedora)
        env:
          BASE: ${{ needs.resolve.outputs.base }}
        run: |
          set -euo pipefail
          sudo -E buildah build \
            --file ./Containerfile \
            --format docker \
            --layers \
            --build-arg BASE_IMAGE="$BASE" \
            --build-arg KERNEL_FLAVOR=fedora \
            --secret id=mok-key,src=/tmp/margine-secrets/MOK.key \
            --secret id=mok-cert,src=/tmp/margine-secrets/MOK.pem \
            --tag "$SRC" \
            .
          sudo buildah images "$SRC"

      - name: Wipe staged secrets
        if: always()
        run: rm -rf /tmp/margine-secrets

      - name: Run shipped validators in-container (image context)
        run: |
          set -euo pipefail
          for v in lucciola-validate-margine-system lucciola-validate-branding; do
            echo "=== $v (MARGINE_VALIDATE_CONTEXT=image) ==="
            sudo podman run --rm -e MARGINE_VALIDATE_CONTEXT=image --entrypoint "/usr/bin/$v" "$SRC"
          done

      - name: Validate first-boot assets in built image
        run: sudo .github/scripts/validate-image-rootfs.sh "$SRC"

      - name: Prove the kernel is the base's own Fedora kernel
        id: kernel
        env:
          BASE: ${{ needs.resolve.outputs.base }}
        run: |
          set -euo pipefail
          q() { sudo podman run --rm --entrypoint /usr/bin/rpm "$1" -q --qf '%{VERSION}-%{RELEASE}.%{ARCH}\n' kernel-core; }
          flavor="$(sudo podman run --rm --entrypoint /usr/bin/cat "$SRC" /usr/share/margine/kernel-flavor)"
          [ "$flavor" = fedora ] || { echo "::error::kernel-flavor is '$flavor', not fedora"; exit 1; }
          if sudo podman run --rm --entrypoint /usr/bin/rpm "$SRC" -q kernel-cachyos >/dev/null 2>&1; then
            echo "::error::kernel-cachyos is installed in the reserve"; exit 1
          fi
          KVER="$(q "$SRC")"
          BASE_KVER="$(q "$BASE")"
          [ "$KVER" = "$BASE_KVER" ] || { echo "::error::the reserve ships kernel $KVER, the base $BASE_KVER: it must keep the base's"; exit 1; }
          MODS="$(sudo podman run --rm --entrypoint /usr/bin/ls "$SRC" /usr/lib/modules)"
          [ "$MODS" = "$KVER" ] || { echo "::error::/usr/lib/modules holds '$MODS', expected only $KVER"; exit 1; }
          command -v sbverify >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq sbsigntool; }
          sudo podman run --rm --entrypoint /usr/bin/cat "$SRC" "/usr/lib/modules/$KVER/vmlinuz" | cat > vmlinuz
          sbverify --list vmlinuz | grep -q 'Fedora' \
            || { echo "::error::vmlinuz carries no Fedora signature"; sbverify --list vmlinuz || true; exit 1; }
          # v4l2loopback (the phone camera) is best-effort in the build, as on
          # :stable: a warning here, not a failure.
          # shellcheck disable=SC2016
          SIGNER="$(sudo podman run --rm --entrypoint /bin/bash "$SRC" -c \
                    'f="$(find /usr/lib/modules -name "v4l2loopback.ko*" | head -n1)"; [ -n "$f" ] && modinfo -F signer "$f"' || true)"
          case "$SIGNER" in
            *Margine*) echo "v4l2loopback signed by: $SIGNER" ;;
            "")        echo "::warning::no v4l2loopback module in the reserve: the phone camera will not work on it" ;;
            *)         echo "::warning::v4l2loopback is signed by '$SIGNER', not the Margine key" ;;
          esac
          echo "kver=$KVER" >> "$GITHUB_OUTPUT"
          echo "Kernel in the reserve: $KVER (Fedora's, as in the base)"

      - name: Chunk the image (chunkah, same as build.yml)
        id: rechunk
        env:
          # Keep in step with build.yml (Renovate bumps it there): chunked
          # differently, :stable and the reserve would share no layers.
          CHUNKAH_REF: quay.io/coreos/chunkah:v0.7.1@sha256:71e593421c5de7dcc7c8c5c50e98d3bac572055a76f399f61a491d123c20a523
          KVER: ${{ steps.kernel.outputs.kver }}
          VERSION: ${{ needs.resolve.outputs.version }}
          REVISION: ${{ needs.resolve.outputs.ref }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BASE_DIGEST: ${{ needs.resolve.outputs.base_digest }}
          BASE_NAME: ${{ needs.resolve.outputs.base_name }}
          CREATED: ${{ needs.resolve.outputs.created }}
          RESERVE_OF: ${{ needs.resolve.outputs.stable_digest }}
          PRERELEASE: ${{ needs.resolve.outputs.public != 'true' }}
        run: |
          set -euo pipefail
          OUT_DIR="${RUNNER_TEMP}/chunk-out"
          sudo rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          # build.yml's list, plus the flavour and the :stable digest this
          # reserve belongs to (empty on a test run, so left out).
          labels=(
            "org.opencontainers.image.title=${IMAGE_NAME}"
            "org.opencontainers.image.description=${IMAGE_DESC}"
            "org.opencontainers.image.source=https://github.com/${REPO}"
            "org.opencontainers.image.url=https://github.com/${REPO}"
            "org.opencontainers.image.vendor=${OWNER}"
            "org.opencontainers.image.licenses=Apache-2.0"
            "org.opencontainers.image.version=${VERSION}"
            "org.opencontainers.image.revision=${REVISION}"
            "org.opencontainers.image.created=${CREATED}"
            "org.opencontainers.image.base.digest=${BASE_DIGEST}"
            "org.opencontainers.image.base.name=${BASE_NAME}"
            "io.artifacthub.package.keywords=${IMAGE_KEYWORDS}"
            "io.artifacthub.package.license=Apache-2.0"
            "io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${REPO}/${REVISION}/README.md"
            "io.artifacthub.package.deprecated=false"
            "io.artifacthub.package.prerelease=${PRERELEASE}"
            "containers.bootc=1"
            "dev.margine.kernel=${KVER}"
            "dev.margine.kernel-flavor=fedora"
            "dev.margine.reserve-of=${RESERVE_OF}"
            "ostree.bootable=true"
            "ostree.linux=${KVER}"
          )
          label_args=()
          for l in "${labels[@]}"; do
            [ -n "${l#*=}" ] || { echo "empty label ${l%%=*}, skipping"; continue; }
            label_args+=(--label "$l")
          done
          for attempt in 1 2 3; do
            sudo podman pull "$CHUNKAH_REF" && break
            echo "chunkah pull attempt $attempt failed, retrying in 10s"; sleep 10
          done
          sudo podman inspect "$SRC" | sudo tee "${OUT_DIR}/config.json" >/dev/null
          sudo podman run --rm --pull=never \
            --security-opt label=type:unconfined_t \
            --mount=type=image,src="$SRC",target=/chunkah \
            --volume "${OUT_DIR}:/run/out:Z" \
            -e CHUNKAH_ROOTFS=/chunkah \
            "$CHUNKAH_REF" build \
            --config /run/out/config.json \
            --max-layers 127 \
            --prune /sysroot/ \
            --prune /run/ \
            --label ostree.commit- \
            --label ostree.final-diffid- \
            "${label_args[@]}" \
            --output oci:/run/out/image
          [ "$(sudo jq '.manifests | length' "${OUT_DIR}/image/index.json")" -gt 0 ] || {
            echo "::error::chunkah left ${OUT_DIR}/image without a manifest"
            exit 1
          }
          sudo du -sh "${OUT_DIR}/image"
          echo "ref=oci:${OUT_DIR}/image" >> "$GITHUB_OUTPUT"
          sudo podman rmi -f "$SRC" >/dev/null 2>&1 || true
          df -h / | tail -1

      # build.yml's "Load the chunked image" (review N3): the chunker's
      # layout, loaded once, its image ID checked against the config its
      # manifest names; the checks below read it and the push step refuses
      # a registry manifest with another config.
      - name: Load the chunked image (the one pushed and signed)
        id: chunked
        env:
          REF: ${{ steps.rechunk.outputs.ref }}
          IMG: localhost/lucciola:reserve-chunked
        run: |
          set -euo pipefail
          LAYOUT="${REF#oci:}"
          [ "$(sudo jq '.manifests | length' "$LAYOUT/index.json")" = 1 ] \
            || { echo "::error::the chunked layout must hold exactly one image"; exit 1; }
          MANIFEST="$(sudo jq -r '.manifests[0].digest' "$LAYOUT/index.json")"
          CONFIG="$(sudo jq -r '.config.digest' "$LAYOUT/blobs/sha256/${MANIFEST#sha256:}")"
          [[ "$CONFIG" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no config digest in $MANIFEST"; exit 1; }
          sudo skopeo copy --quiet "oci:${LAYOUT}" "containers-storage:${IMG}"
          ID="sha256:$(sudo podman image inspect --format '{{.Id}}' "$IMG")"
          [ "$ID" = "$CONFIG" ] || { echo "::error::loaded image $ID is not the chunked config $CONFIG"; exit 1; }
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
          echo "config=$CONFIG" >> "$GITHUB_OUTPUT"
          echo "Chunked image: manifest $MANIFEST, config $CONFIG"

      - name: The chunked kernel still carries Fedora's signature
        run: |
          set -euo pipefail
          CID="$(sudo podman create "${{ steps.chunked.outputs.image }}" true)"
          trap 'sudo podman rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          MNT="$(sudo podman mount "$CID")"
          KVER="$(sudo ls "$MNT/usr/lib/modules" | head -1)"
          sudo sbverify --list "$MNT/usr/lib/modules/$KVER/vmlinuz" | grep -q 'Fedora' \
            || { echo "::error::the published kernel lost Fedora's signature"; exit 1; }
          echo "vmlinuz ($KVER) carries Fedora's signature"
          sudo podman unmount "$CID" >/dev/null

      - name: Security scan (secrets fail, drift is reported)
        # build.yml's scanner and baseline. Secrets never ship; baseline
        # drift is judged on build.yml's run of the same commit, here it is
        # only reported. On the chunked image, the one pushed and signed
        # (review N3), as in build.yml.
        env:
          IMG: ${{ steps.chunked.outputs.image }}
        run: |
          set -euo pipefail
          sudo podman run --rm --entrypoint /usr/bin/rpm "$IMG" -qa --qf '[%{FILENAMES}\n]' | cat > owned.txt
          sudo podman container create --replace --name secscan --entrypoint /bin/true "$IMG" >/dev/null
          ROOTFS="$(sudo podman mount secscan)"
          rc=0
          sudo python3 .github/scripts/scan-image-security.py --rootfs "$ROOTFS" --owned owned.txt \
            --baseline .github/security-baseline --report security-report.md || rc=$?
          sudo podman unmount secscan >/dev/null; sudo podman rm secscan >/dev/null
          { echo "### Image security scan (exit $rc)"; sudo cat security-report.md; } >> "$GITHUB_STEP_SUMMARY"
          case "$rc" in
            0) ;;
            1) echo "::warning::security baseline drift in the reserve (see the step summary)" ;;
            2) echo "::error::secrets found in the image: never shipped"; exit 1 ;;
            *) echo "::error::security scan failed to run (exit $rc)"; exit 1 ;;
          esac

      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Generate SBOM (mounted rootfs, as in build.yml)
        env:
          IMG: ${{ steps.chunked.outputs.image }}
        run: |
          set -euo pipefail
          sudo podman container create --replace --name sbom-export --entrypoint /bin/true "$IMG" >/dev/null
          ROOTFS="$(sudo podman mount sbom-export)"
          sudo "$(which syft)" --source-name "${IMAGE_NAME}:${{ needs.resolve.outputs.version }}" \
            "$ROOTFS" -o spdx-json=sbom.spdx.json
          sudo chown "$(id -u):$(id -g)" sbom.spdx.json
          echo "SBOM package count: $(jq '.packages | length' sbom.spdx.json)"
          sudo podman unmount sbom-export >/dev/null || true
          sudo podman container rm sbom-export >/dev/null || true

      - name: Upload SBOM as workflow artifact (handoff to sign job)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-reserve-${{ github.run_id }}
          path: sbom.spdx.json
          retention-days: 1
          if-no-files-found: error

      - name: Push to the staging tag
        id: push
        env:
          PUSH_TAG: ${{ needs.resolve.outputs.push_tag }}
          SCANNED_CONFIG: ${{ steps.chunked.outputs.config }}
        run: |
          set -euo pipefail
          IMG_FULL="ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}"
          IMG_FULL="${IMG_FULL,,}"
          CREDS="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"
          # One upload; the public tags later point at this same manifest
          # (smoke job), so the one signature covers all of them.
          sudo skopeo copy --retry-times 5 --dest-creds="$CREDS" \
            --digestfile=/tmp/digest.txt \
            "${{ steps.rechunk.outputs.ref }}" "docker://${IMG_FULL}:${PUSH_TAG}"
          DIGEST="$(cat /tmp/digest.txt)"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::failed to capture the manifest digest"; exit 1; }
          got="$(sudo skopeo inspect --retry-times 3 --no-tags --creds "$CREDS" "docker://${IMG_FULL}:${PUSH_TAG}" --format '{{.Digest}}')"
          [ "$got" = "$DIGEST" ] || { echo "::error::${IMG_FULL}:${PUSH_TAG} is ${got}, not the pushed ${DIGEST}"; exit 1; }
          # Signed by digest in the sign job: it must be the image the scan and
          # the SBOM read (review N3), same config, so the same layers.
          CONFIG="$(sudo skopeo inspect --retry-times 3 --raw --creds "$CREDS" "docker://${IMG_FULL}@${DIGEST}" | jq -r '.config.digest')"
          [ "$CONFIG" = "$SCANNED_CONFIG" ] || { echo "::error::pushed ${DIGEST} has config ${CONFIG}, the scanned image ${SCANNED_CONFIG}"; exit 1; }
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMG_FULL}@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${IMG_FULL}:${PUSH_TAG} @ ${DIGEST}"

  sign:
    name: Cosign sign (by digest) + SBOM attach + sign
    needs: build_push
    # Explicit status, as in build.yml: resolve can be skipped, and an
    # implicit success() would then skip this job on the main path.
    if: ${{ !cancelled() && needs.build_push.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Cosign login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Sign image by digest (bundle + classic format)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ""
          IMAGE_REF: ${{ needs.build_push.outputs.image_ref }}
        run: |
          set -euo pipefail
          [ -n "$IMAGE_REF" ] || { echo "::error::needs.build_push.outputs.image_ref is empty"; exit 1; }
          [ -n "$COSIGN_PRIVATE_KEY" ] || { echo "::error::COSIGN_PRIVATE_KEY is not available to this workflow"; exit 1; }
          echo "Signing: ${IMAGE_REF}"
          cosign sign -y --key env://COSIGN_PRIVATE_KEY "${IMAGE_REF}"
          # The classic sha256-<digest>.sig signature is the one devices
          # (containers/image) read; see build.yml.
          cosign sign -y --key env://COSIGN_PRIVATE_KEY \
            --new-bundle-format=false --use-signing-config=false "${IMAGE_REF}"

      - name: Download SBOM artifact (from build_push)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-reserve-${{ github.run_id }}
          path: .

      - name: Install ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2

      - name: Attach + cosign-sign SBOM
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ""
          IMAGE_REF: ${{ needs.build_push.outputs.image_ref }}
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
          ATTACH_JSON="$(oras attach \
            --artifact-type application/vnd.spdx+json \
            --annotation org.opencontainers.artifact.created="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --annotation org.opencontainers.artifact.description="SPDX SBOM for ${IMAGE_REF}" \
            --format json \
            "${IMAGE_REF}" \
            sbom.spdx.json:application/spdx+json)"
          ATTACH_DIGEST="$(jq -r '.reference | split("@")[1] // .digest // empty' <<<"$ATTACH_JSON")"
          [ -n "$ATTACH_DIGEST" ] || { echo "::error::oras attach did not return a digest (raw: $ATTACH_JSON)"; exit 1; }
          SBOM_REF="${IMAGE_REF%@*}@${ATTACH_DIGEST}"
          echo "Signing SBOM: ${SBOM_REF}"
          cosign sign -y --key env://COSIGN_PRIVATE_KEY "${SBOM_REF}"

  smoke:
    name: Boot in QEMU (Secure Boot, TPM), then move the public tag
    needs: [resolve, build_push, sign]
    if: ${{ !cancelled() && needs.sign.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write   # the public tag moves from here
    outputs:
      passed: ${{ steps.boot.outputs.passed }}
      promoted: ${{ steps.promote.outputs.promoted }}
    env:
      PINNED: ${{ needs.build_push.outputs.image_ref }}
    # The steps up to the boot verdict are smoke-boot.yml's: keep them in
    # step (the scripts they call are shared).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # v10
        with:
          remove-codeql: true

      - name: Keep bwrap children in the parent AppArmor profile (Ubuntu 26.04)
        run: |
          if sudo test -r /etc/apparmor.d/bwrap-userns-restrict &&
             sudo test -r /sys/kernel/security/apparmor/profiles &&
             sudo grep -qx 'bwrap (enforce)' /sys/kernel/security/apparmor/profiles; then
            printf '%s\n' 'priority=100 allow file rwlkm /**,' 'priority=100 allow ix /**,' \
              | sudo tee /etc/apparmor.d/local/bwrap-userns-restrict >/dev/null
            sudo apparmor_parser -Q /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
            echo "bwrap AppArmor override installed"
          else
            echo "bwrap-userns-restrict not enforced on this runner, nothing to do"
          fi

      - name: Install QEMU + OVMF + tools
        run: |
          apt_retry() {
            for i in 1 2 3; do
              sudo timeout 600 apt-get "$@" && return 0
              echo "::warning::apt-get $* failed/timed out (attempt $i); retrying in $((i * 15))s"
              sleep $((i * 15))
            done
            return 1
          }
          apt_retry update -qq
          apt_retry install -y -qq qemu-system-x86 qemu-utils ovmf swtpm swtpm-tools python3-virt-firmware parted util-linux
          ls -la /dev/kvm || true

      - name: Build qcow2 with bootc-image-builder
        run: |
          set -euo pipefail
          mkdir -p output
          sudo podman pull "$PINNED"
          # Same builder digest and disk layout as smoke-boot.yml.
          sudo podman run --rm \
            --privileged \
            --security-opt label=type:unconfined_t \
            -v "$(pwd)/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$(pwd)/disk_config/disk-smoke.toml:/config.toml:ro" \
            quay.io/centos-bootc/bootc-image-builder@sha256:7ae88b8d6f2cabfa971d7836b96d6cac19cd1384e658031bd154f9687e929905 \
            --type qcow2 \
            --rootfs btrfs \
            "$PINNED"
          ls -la output/qcow2/
          sudo chown "$(id -u):$(id -g)" -R output/

      - name: Prepare Secure Boot variables (Microsoft keys + Margine MOK)
        # Fedora's kernel boots on the Microsoft keys alone (shim carries
        # Fedora's certificate); the Margine key is enrolled as on a real
        # install, for v4l2loopback and the security probe.
        run: |
          set -euo pipefail
          sudo podman run --rm --entrypoint /usr/bin/cat "$PINNED" /usr/share/cert/MOK.der | cat > MOK.der
          openssl x509 -inform DER -in MOK.der -noout -subject
          openssl x509 -inform DER -in MOK.der -out MOK.pem
          virt-fw-vars --input /usr/share/OVMF/OVMF_VARS_4M.ms.fd --output sb-vars.fd \
            --add-mok 605dab50-e046-4300-abb6-3dd810dd8b23 MOK.pem

      - name: Inject GUI smoke probe (Layer C)
        id: inject
        continue-on-error: true
        run: |
          set -euo pipefail
          QCOW=$(ls output/qcow2/*.qcow2 | head -1)
          sudo IMAGE_REF="$PINNED" .github/scripts/inject-gui-probe.sh "$QCOW"

      - name: Boot qcow2 in QEMU and wait for a usable state
        id: boot
        run: |
          set -euo pipefail
          QCOW=$(ls output/qcow2/*.qcow2 | head -1)
          sudo -E GITHUB_OUTPUT="$GITHUB_OUTPUT" .github/scripts/qemu-boot-wait.sh \
            --disk "$QCOW" \
            --log serial.log \
            --timeout 1800 \
            --gui-watch \
            --secure-boot sb-vars.fd \
            --tpm \
            --allow-reboot \
            --sec-watch

      - name: Probe markers (annotation)
        if: always()
        continue-on-error: true
        run: |
          {
            echo "### Kernel reserve boot"
            if [[ ! -f serial.log ]]; then echo "- no serial.log"; exit 0; fi
            echo '```'
            grep -aE 'MARGINE-(USER-SMOKE|GUI-SMOKE|SEC|SEC-SMOKE|GREETD): ' serial.log | tr -d '\r' \
              | grep -aE ' (FAIL|WARN|PASS$|VERDICT|SUMMARY)| KERNEL ' | awk '!seen[$0]++' | head -n 60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-reserve-serial-log
          path: serial.log
          retention-days: 7

      - name: Boot verdict must have reached the workflow
        if: success() && steps.boot.outputs.passed == ''
        run: |
          echo "::error::qemu-boot-wait.sh exited 0 but wrote no passed= output; the tag would not move and nobody would know why."
          exit 1

      - name: Install cosign (signature gate)
        if: success() && steps.boot.outputs.passed == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Image must be signed with the Margine key
        if: success() && steps.boot.outputs.passed == 'true'
        run: |
          set -euo pipefail
          cosign verify --key secrets/cosign.pub --new-bundle-format=false "$PINNED" > /dev/null \
            || { echo "::error::${PINNED} has no valid classic-format signature from secrets/cosign.pub"; exit 1; }
          echo "Signature OK (classic format, Margine key): ${PINNED}"

      - name: Move the public tag (public runs only)
        id: promote
        if: success() && steps.boot.outputs.passed == 'true' && needs.resolve.outputs.public == 'true'
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          YMD: ${{ needs.resolve.outputs.ymd }}
          STABLE_DIGEST: ${{ needs.resolve.outputs.stable_digest }}
        run: |
          set -euo pipefail
          REGISTRY_IMAGE="${PINNED%@*}"
          DIGEST="${PINNED#*@}"
          if [ "$REGISTRY_IMAGE" != "ghcr.io/daniel-g-carrasco/lucciola" ]; then
            echo "::error::refusing to tag ${REGISTRY_IMAGE}: only ghcr.io/daniel-g-carrasco/lucciola is published from here"
            exit 1
          fi
          case "$TAG" in stable|stable.*|candidate|candidate.*|latest|"") echo "::error::refusing to move :$TAG from the kernel reserve"; exit 1 ;; esac
          echo "$GHCR_TOKEN" | sudo skopeo login --username "$GHCR_USER" --password-stdin ghcr.io
          # Only while :stable is still the one this reserve was built for: a
          # late re-run of an older run must not move the tag backwards.
          now="$(sudo skopeo inspect --retry-times 3 --no-tags "docker://${REGISTRY_IMAGE}:stable" --format '{{.Digest}}')"
          if [ "$now" != "$STABLE_DIGEST" ]; then
            echo "::warning:::stable moved to ${now} since this reserve was built for ${STABLE_DIGEST}: :${TAG} left alone, the next run builds the new one"
            exit 0
          fi
          for t in "$TAG" "${TAG}.${YMD}"; do
            sudo skopeo copy --retry-times 3 --preserve-digests "docker://${PINNED}" "docker://${REGISTRY_IMAGE}:${t}"
            got="$(sudo skopeo inspect --retry-times 3 --no-tags "docker://${REGISTRY_IMAGE}:${t}" --format '{{.Digest}}')"
            [ "$got" = "$DIGEST" ] || { echo "::error::${REGISTRY_IMAGE}:${t} is ${got}, not ${DIGEST}: it would be unsigned"; exit 1; }
          done
          echo "promoted=true" >> "$GITHUB_OUTPUT"
          {
            echo "### Published"
            echo "- \`:${TAG}\` and \`:${TAG}.${YMD}\` = \`${DIGEST}\`"
            echo "- built for :stable \`${STABLE_DIGEST}\`"
            echo "- Layer C GUI probe: \`${{ steps.boot.outputs.gui || 'n/a' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: ntfy notification
    needs: [resolve, build_push, sign, smoke]
    # Every run that tried to build (or could not tell); silent when there
    # was nothing to do.
    if: ${{ always() && needs.resolve.result != 'skipped' && needs.resolve.outputs.build != 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Notify ntfy
        env:
          NTFY_URL: ${{ secrets.NTFY_TOPIC_URL }}
          RESOLVE: ${{ needs.resolve.result }}
          BUILD: ${{ needs.build_push.result }}
          SIGN: ${{ needs.sign.result }}
          SMOKE: ${{ needs.smoke.result }}
          PASSED: ${{ needs.smoke.outputs.passed }}
          PROMOTED: ${{ needs.smoke.outputs.promoted }}
          PUBLIC: ${{ needs.resolve.outputs.public }}
          TAG: ${{ needs.resolve.outputs.tag }}
          PUSH_TAG: ${{ needs.resolve.outputs.push_tag }}
          KVER: ${{ needs.build_push.outputs.kver }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "${NTFY_URL:-}" ] || { echo "NTFY_TOPIC_URL secret not set, skipping notification."; exit 0; }
          if [ "$PUBLIC" = true ] && [ "$PROMOTED" = true ]; then
            TITLE="Kernel reserve: :${TAG} published"; PRIO=low; TAGS="white_check_mark,penguin"
            MSG="Fedora kernel ${KVER}, built for the current :stable, booted with Secure Boot and TPM."
          elif [ "$PUBLIC" = true ] && [ "$SMOKE" = success ] && [ "$PASSED" = true ]; then
            TITLE="Kernel reserve built, not published: :stable moved on"; PRIO=low; TAGS="fast_forward,penguin"
            MSG="The next run builds the reserve for the new :stable."
          elif [ "$PUBLIC" != true ] && [ "$SMOKE" = success ] && [ "$PASSED" = true ]; then
            TITLE="Kernel reserve test OK: :${PUSH_TAG}"; PRIO=low; TAGS="white_check_mark,test_tube"
            MSG="Fedora kernel ${KVER}. Test tag only; :${TAG:-the public tag} not touched."
          elif [ "$RESOLVE" = cancelled ] || [ "$BUILD" = cancelled ] || [ "$SIGN" = cancelled ] || [ "$SMOKE" = cancelled ]; then
            TITLE="Kernel reserve run cancelled"; PRIO=low; TAGS="warning"; MSG=""
          elif [ "$PUBLIC" != true ] && [ "$RESOLVE" = success ]; then
            TITLE="Kernel reserve test FAILED: :${PUSH_TAG}"; PRIO=default; TAGS="x,test_tube"
            MSG="build=${BUILD} sign=${SIGN} smoke=${SMOKE} (boot passed=${PASSED:-n/a}). Test only: nothing public changed."
          else
            TITLE="Kernel reserve FAILED: :${TAG:-the reserve tag} not moved"; PRIO=high; TAGS="x,penguin"
            MSG="resolve=${RESOLVE} build=${BUILD} sign=${SIGN} smoke=${SMOKE} (boot passed=${PASSED:-n/a}). The next six-hour tick retries, or re-run the failed jobs."
          fi
          curl --silent --show-error --fail \
            -H "Title: ${TITLE}" -H "Priority: ${PRIO}" -H "Tags: ${TAGS}" -H "Click: ${RUN_URL}" \
            -d "$MSG" "$NTFY_URL" || echo "ntfy notify failed (non-fatal)"
