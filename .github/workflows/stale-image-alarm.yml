name: Stale image / base alarm

# The 2026-08 outage lasted ten days before anyone noticed, and the reason
# is that nothing in the pipeline watches the CLOCK. Every existing signal
# is edge-triggered: a build fails, ntfy fires; a build never starts, and
# the whole system stays quiet with the last green run still on the page.
# status.json reports the age of :stable but nobody reads it.
#
# So: one job, once a day, that asks the only question that matters to
# someone on the receiving end. For an existing user sitting in front of
# `ujust margine-update`, how old is the image they would get? (Margine
# also measured its published ISO on archive.org; Lucciola has no ISO yet,
# so that check comes back with it.) It alarms on two channels on purpose:
#   - ntfy, for the push notification;
#   - a FAILING workflow run, so the alarm survives a dead ntfy topic and
#     shows up red in the Actions list and in GitHub's own e-mail.
# It stays red every day until a fresh image lands, which is the point:
# a one-shot notification is exactly what got missed last time.

on:
  schedule:
    - cron: "37 7 * * *" # daily
  workflow_dispatch:
    inputs:
      max_age_days:
        description: "Age in days above which :stable counts as stale"
        required: false
        default: "9"
      base_max_age_days:
        description: "Age in days above which the upstream base image counts as stale"
        required: false
        default: "14"

permissions:
  contents: read

concurrency:
  group: stale-image-alarm
  cancel-in-progress: true

jobs:
  check:
    name: How old is :stable?
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Inspect :stable and measure its age
        id: age
        env:
          # 9 days, not 7: the scheduled build runs weekly (Sundays 04:00
          # UTC) on top of the push-triggered ones, so a single missed
          # Sunday is the smallest real failure worth waking up for, and
          # it trips this two days later instead of waiting for the next
          # week to pass unnoticed.
          MAX_AGE: ${{ inputs.max_age_days || '9' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }
          # Authenticated inspect: 5000 req/h instead of the anonymous 100.
          skopeo login ghcr.io -u "${{ github.actor }}" -p "$GH_TOKEN"

          IMAGE="ghcr.io/${{ github.repository_owner }}/lucciola:stable"
          # A registry blip must not read as "the image is fine". If the
          # inspect fails we alarm, with a different message.
          if ! RAW="$(skopeo inspect "docker://${IMAGE}" 2>&1)"; then
            {
              echo "state=unreachable"
              echo "age="
              echo "detail<<EOF"
              printf '%s\n' "$RAW" | tail -3
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CREATED="$(jq -r '.Created // empty' <<<"$RAW")"
          DIGEST="$(jq -r '.Digest // empty' <<<"$RAW")"
          if [ -z "$CREATED" ]; then
            echo "state=unreachable" >> "$GITHUB_OUTPUT"
            echo "age=" >> "$GITHUB_OUTPUT"
            echo "detail=inspect returned no Created field" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # date -d handles the RFC3339 the registry returns, fractional
          # seconds included.
          CREATED_EPOCH="$(date -u -d "$CREATED" +%s)"
          NOW_EPOCH="$(date -u +%s)"
          AGE_DAYS=$(( (NOW_EPOCH - CREATED_EPOCH) / 86400 ))

          echo "Image:   $IMAGE"
          echo "Digest:  $DIGEST"
          echo "Created: $CREATED"
          echo "Age:     $AGE_DAYS days (threshold $MAX_AGE)"

          if [ "$AGE_DAYS" -gt $(( MAX_AGE * 2 )) ]; then
            STATE=critical
          elif [ "$AGE_DAYS" -gt "$MAX_AGE" ]; then
            STATE=stale
          else
            STATE=fresh
          fi
          {
            echo "state=$STATE"
            echo "age=$AGE_DAYS"
            echo "created=${CREATED:0:10}"
            echo "digest=$DIGEST"
            echo "threshold=$MAX_AGE"
          } >> "$GITHUB_OUTPUT"

      - name: Notify ntfy
        if: steps.age.outputs.state != 'fresh'
        env:
          NTFY_URL: ${{ secrets.NTFY_TOPIC_URL }}
          STATE:     ${{ steps.age.outputs.state }}
          AGE:       ${{ steps.age.outputs.age }}
          CREATED:   ${{ steps.age.outputs.created }}
          THRESHOLD: ${{ steps.age.outputs.threshold }}
          DETAIL:    ${{ steps.age.outputs.detail }}
        run: |
          set -euo pipefail
          if [ -z "${NTFY_URL:-}" ]; then
            echo "NTFY_TOPIC_URL secret not set, skipping notification."
            exit 0
          fi
          if [ "$STATE" = "unreachable" ]; then
            TITLE="Cannot inspect :stable"
            PRIO="high"
            TAGS="warning,mag"
            MSG="skopeo could not read ghcr.io/lucciola:stable. Registry blip, or the tag is gone. ${DETAIL}"
          elif [ "$STATE" = "critical" ]; then
            TITLE=":stable is ${AGE} days old"
            PRIO="urgent"
            TAGS="rotating_light,hourglass"
            MSG="Published ${CREATED}. More than twice the ${THRESHOLD}-day threshold: the pipeline has stopped producing images. This is the ten-day outage repeating."
          else
            TITLE=":stable is ${AGE} days old"
            PRIO="high"
            TAGS="hourglass,construction"
            MSG="Published ${CREATED}, past the ${THRESHOLD}-day threshold. Check whether the build is failing or simply not running."
          fi
          curl -fsS -X POST \
            -H "Title: ${TITLE}" \
            -H "Priority: ${PRIO}" \
            -H "Tags: ${TAGS}" \
            -H "Actions: view, Open Actions, ${{ github.server_url }}/${{ github.repository }}/actions" \
            -d "${MSG}" \
            "$NTFY_URL" >/dev/null

      - name: Inspect the upstream base image and measure its age
        id: base
        # Lucciola is FROM ghcr.io/ublue-os/silverblue-main:45, which
        # Universal Blue rebuilds daily. A tag that quietly stops being
        # refreshed would have every Lucciola build after it silently ship
        # an ageing base, so 14 days without a refresh is an alarm, and
        # the tag disappearing is its own alarm, never a silent pass
        # (that is how the -dx retirement would have shown up).
        env:
          BASE_IMAGE: ghcr.io/ublue-os/silverblue-main:45
          BASE_MAX_AGE: ${{ inputs.base_max_age_days || '14' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "image=$BASE_IMAGE" >> "$GITHUB_OUTPUT"
          if ! RAW="$(skopeo inspect --no-tags "docker://${BASE_IMAGE}" 2>&1)"; then
            echo "::warning::could not inspect ${BASE_IMAGE}: ${RAW##*$'\n'}"
            echo "state=gone" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CREATED="$(jq -r '.Created // empty' <<<"$RAW")"
          VERSION="$(jq -r '.Labels["org.opencontainers.image.version"] // "?"' <<<"$RAW")"
          [ -n "$CREATED" ] || { echo "state=gone" >> "$GITHUB_OUTPUT"; exit 0; }
          AGE_DAYS=$(( ( $(date -u +%s) - $(date -u -d "$CREATED" +%s) ) / 86400 ))
          echo "Base: $BASE_IMAGE  version $VERSION  created ${CREATED:0:10}  age ${AGE_DAYS}d (threshold ${BASE_MAX_AGE}d)"
          {
            echo "age=$AGE_DAYS"
            echo "version=$VERSION"
            echo "threshold=$BASE_MAX_AGE"
            echo "state=$([ "$AGE_DAYS" -gt "$BASE_MAX_AGE" ] && echo stale || echo fresh)"
          } >> "$GITHUB_OUTPUT"

      - name: Notify ntfy about the base image
        if: steps.base.outputs.state == 'stale' || steps.base.outputs.state == 'gone'
        env:
          NTFY_URL: ${{ secrets.NTFY_TOPIC_URL }}
          STATE: ${{ steps.base.outputs.state }}
          AGE: ${{ steps.base.outputs.age }}
          IMAGE: ${{ steps.base.outputs.image }}
        run: |
          set -euo pipefail
          [ -n "${NTFY_URL:-}" ] || { echo "NTFY_TOPIC_URL secret not set, skipping notification."; exit 0; }
          if [ "$STATE" = "gone" ]; then
            TITLE="The upstream base image cannot be read"
            MSG="${IMAGE} no longer inspects. If Universal Blue has retired the tag, every future Lucciola build is blocked until the FROM moves."
            PRIO="urgent"; TAGS="rotating_light,package"
          else
            TITLE="The upstream base is ${AGE} days old"
            MSG="${IMAGE} has not been refreshed in ${AGE} days. Universal Blue rebuilds main daily; either upstream is stuck or the tag is being wound down."
            PRIO="high"; TAGS="hourglass,package"
          fi
          curl -fsS -X POST -H "Title: ${TITLE}" -H "Priority: ${PRIO}" -H "Tags: ${TAGS}" -d "${MSG}" "$NTFY_URL" >/dev/null

      - name: Fail the run while something is stale
        # Deliberate: this run stays red every day until a fresh image is
        # published. The red X in the Actions list and GitHub's e-mail are
        # the channel that does not depend on ntfy being alive.
        if: steps.age.outputs.state != 'fresh' || steps.base.outputs.state == 'stale' || steps.base.outputs.state == 'gone'
        run: |
          if [ "${{ steps.age.outputs.state }}" != "fresh" ]; then
            echo "::error::ghcr.io/lucciola:stable is ${{ steps.age.outputs.age }} days old (state: ${{ steps.age.outputs.state }})"
          fi
          case "${{ steps.base.outputs.state }}" in
            gone)  echo "::error::upstream base ${{ steps.base.outputs.image }} cannot be inspected: the -dx tag may have been retired" ;;
            stale) echo "::error::upstream base ${{ steps.base.outputs.image }} is ${{ steps.base.outputs.age }} days old, past the ${{ steps.base.outputs.threshold }}-day threshold" ;;
          esac
          exit 1

      - name: Report a fresh image and base
        if: steps.age.outputs.state == 'fresh' && steps.base.outputs.state != 'stale' && steps.base.outputs.state != 'gone'
        run: |
          echo ":stable is ${{ steps.age.outputs.age }} days old, within the ${{ steps.age.outputs.threshold }}-day threshold."
          echo "Upstream base: ${{ steps.base.outputs.image }} version ${{ steps.base.outputs.version || '?' }}, ${{ steps.base.outputs.age || '?' }} days old."
