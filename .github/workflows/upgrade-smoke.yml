# Upgrade smoke: does an INSTALLED system move to a new image cleanly?
#
# The smoke-boot gate boots a fresh disk of the image under test. This
# one boots a disk built from an OLD image (what users run today), layers
# a package, rebases to the NEW image, reboots and checks the result over
# the serial console: the booted deployment, Secure Boot, failed units, the
# layered package, the base's masked timers, Flathub only, uupd, the /etc
# merge, the policy scope the next update is verified against, the login
# screen (GDM on margine:lucciola, greetd with Noctalia Greeter running
# after the update), the gaming-native dry run, the shipped validator. Written in Margine for the
# base switch of 2026-10-11 (Bluefin DX to Universal Blue's silverblue-main).
#
# In Lucciola its main job is the move real users will make: from
# ghcr.io/daniel-g-carrasco/margine:lucciola, where Lucciola was published
# until it got its own repository, to this repository's image. The default
# transport is ostree-unverified-registry because that is the only honest
# one for that move: the policy on a margine:lucciola install has a scope
# for the Margine repository only, so ostree-image-signed:docker:// of the
# lucciola repository would fall through to the docker catch-all
# (insecureAcceptAnything) and verify nothing while looking verified. The
# check moves to the new deployment, which must carry a signature-required
# scope for ghcr.io/daniel-g-carrasco/lucciola. Once the Margine side ships
# that scope (the migration step), switch the default to
# ostree-image-signed; for a lucciola-to-lucciola upgrade pick it by hand.
#
# On demand (workflow_dispatch: one move, the inputs below) and weekly
# (Sunday 08:00 UTC, after the weekly build and its smoke-boot): every
# starting point the guide names, one VM at a time, from the matrix
# .github/scripts/upgrade-matrix.py prints (margine:lucciola with a layered
# package, stock Silverblue, Kinoite and Bluefin; steam layered only once
# :stable is promoted, see the script). A failed cell notifies ntfy with
# its name and does not cancel the others. Nothing is promoted or published.
name: Upgrade smoke (old install to new image)

on:
  workflow_dispatch:
    inputs:
      from_ref:
        # A tag, not a bare digest: an untagged manifest is garbage
        # collected (the last Bluefin-based :stable vanished the day :stable
        # moved on and its dated tag was overwritten by the new build of the
        # same day). :lucciola is what Lucciola users run today; pass a dated
        # :lucciola.YYYYMMDD to pin the starting point.
        description: "OLD image: what the installed system runs (tag or tag@digest; a dated tag survives GC, a bare digest may not)"
        required: false
        default: "ghcr.io/daniel-g-carrasco/margine:lucciola"
      to_ref:
        description: "NEW image to rebase to (tag or tag@digest)"
        required: false
        default: "ghcr.io/daniel-g-carrasco/lucciola:candidate"
      transport:
        description: "How the rebase names the new image: unverified for a repository the old policy does not know (margine:lucciola to lucciola), signed when it does"
        type: choice
        options: [ostree-unverified-registry, ostree-image-signed]
        default: ostree-unverified-registry
      layer:
        description: "Package to layer before the rebase (exercises the re-solve; pick one the image lacks); empty = none"
        required: false
        default: "cowsay"
      expect_id_like:
        description: "ID_LIKE expected on the new deployment"
        required: false
        default: "fedora"
  schedule:
    # Sunday 08:00 UTC: the weekly build runs at 04:00 and its smoke-boot
    # has produced the week's :candidate by then (2026-10-20).
    - cron: '0 8 * * 0'

concurrency:
  group: upgrade-smoke
  cancel-in-progress: false

jobs:
  plan:
    # The cells: one from the inputs on a dispatch, the weekly list on the
    # schedule. A job of its own, with no condition, so upgrade_smoke's
    # implicit success() cannot skip it by accident (check-job-conditions).
    name: Which starting points to test
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Plan the cells
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          PROMOTE_STABLE: ${{ vars.LUCCIOLA_PROMOTE_STABLE }}
          FROM_REF: ${{ inputs.from_ref }}
          TO_REF: ${{ inputs.to_ref }}
          TRANSPORT: ${{ inputs.transport }}
          LAYER: ${{ inputs.layer }}
          EXPECT_ID_LIKE: ${{ inputs.expect_id_like }}
        run: |
          set -euo pipefail
          matrix="$(python3 .github/scripts/upgrade-matrix.py --event "$EVENT" \
            --promote-stable "${PROMOTE_STABLE:-false}" --from "$FROM_REF" --to "$TO_REF" \
            --transport "$TRANSPORT" --layer "$LAYER" --expect-id-like "$EXPECT_ID_LIKE")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  upgrade_smoke:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      # One VM at a time (the runner has one, the workflow one concurrency
      # group); a failed cell must not cancel the ones after it.
      max-parallel: 1
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Maximize build space
        # Same reason as smoke-boot.yml: BIB extracts the image and builds
        # a qcow2 from it, 25 GB peak.
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # v10
        with:
          remove-codeql: true

      - name: Keep bwrap children in the parent AppArmor profile (Ubuntu 26.04)
        # See smoke-boot.yml for the why (bootc-dev/actions#55).
        run: |
          if sudo test -r /etc/apparmor.d/bwrap-userns-restrict &&
             sudo test -r /sys/kernel/security/apparmor/profiles &&
             sudo grep -qx 'bwrap (enforce)' /sys/kernel/security/apparmor/profiles; then
            printf '%s\n' 'priority=100 allow file rwlkm /**,' 'priority=100 allow ix /**,' \
              | sudo tee /etc/apparmor.d/local/bwrap-userns-restrict >/dev/null
            sudo apparmor_parser -Q /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
            echo "bwrap AppArmor override installed"
          else
            echo "bwrap-userns-restrict not enforced on this runner, nothing to do"
          fi

      - name: Install QEMU + OVMF + tools
        run: |
          apt_retry() {
            for i in 1 2 3; do
              sudo timeout 600 apt-get "$@" && return 0
              echo "::warning::apt-get $* failed/timed out (attempt $i); retrying in $((i * 15))s"
              sleep $((i * 15))
            done
            return 1
          }
          apt_retry update -qq
          apt_retry install -y -qq qemu-system-x86 qemu-utils ovmf swtpm swtpm-tools python3-virt-firmware
          # The runner user is not in the kvm group (smoke-boot runs QEMU under
          # sudo for the same reason); the driver runs unprivileged, so open the
          # device to it. First run died on "Could not access KVM kernel module".
          sudo chmod 666 /dev/kvm
          ls -la /dev/kvm

      - name: Resolve both refs to digests
        id: ref
        env:
          FROM_REF: ${{ matrix.from_ref }}
          TO_REF: ${{ matrix.to_ref }}
        run: |
          set -euo pipefail
          resolve() {
            local ref="$1" base digest
            if [[ "$ref" == *"@sha256:"* ]]; then base="${ref%@*}"; digest="${ref#*@}"
              # tag@digest: the digest wins; skopeo refuses a tag and a digest together
              if [[ "${base##*/}" == *:* ]]; then base="${base%:*}"; fi
            else base="${ref%:*}"; digest="$(sudo skopeo inspect --no-tags --format '{{.Digest}}' "docker://$ref")"; fi
            echo "${base}@${digest}"
          }
          FROM="$(resolve "$FROM_REF")"; TO="$(resolve "$TO_REF")"
          echo "from=$FROM" >> "$GITHUB_OUTPUT"; echo "to=$TO" >> "$GITHUB_OUTPUT"
          echo "Installed system: $FROM"; echo "Target image:     $TO"
          for r in "$FROM" "$TO"; do
            sudo skopeo inspect --no-tags "docker://$r" | python3 -c '
          import json,sys; d=json.load(sys.stdin); l=d.get("Labels",{})
          print("  base", l.get("org.opencontainers.image.base.name","?"), "| created", d.get("Created","")[:16], "| rev", l.get("org.opencontainers.image.revision","?")[:7])'
          done

      - name: Build the installed system (qcow2 from the OLD image)
        env:
          FROM: ${{ steps.ref.outputs.from }}
        run: |
          set -euo pipefail
          mkdir -p output
          sudo podman pull "$FROM"
          # A login for the serial console: user "probe" in wheel, password
          # generated here and handed to the driver through the environment.
          PW="$(openssl rand -hex 12)"; echo "::add-mask::$PW"; echo "UPGRADE_PASSWORD=$PW" >> "$GITHUB_ENV"
          HASH="$(openssl passwd -6 "$PW")"
          sed "s|@PASSWORD_HASH@|$HASH|" disk_config/disk-upgrade.toml > disk-upgrade.toml
          sudo podman run --rm \
            --privileged \
            --security-opt label=type:unconfined_t \
            -v "$(pwd)/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$(pwd)/disk-upgrade.toml:/config.toml:ro" \
            quay.io/centos-bootc/bootc-image-builder@sha256:7ae88b8d6f2cabfa971d7836b96d6cac19cd1384e658031bd154f9687e929905 \
            --type qcow2 \
            --rootfs btrfs \
            "$FROM"
          ls -la output/qcow2/
          sudo chown "$(id -u):$(id -g)" -R output/

      - name: Prepare Secure Boot variables (Microsoft keys + Margine MOK)
        # The certificate comes from the NEW image: it is its kernel that must
        # boot after the rebase, and a stock Fedora starting point (Silverblue,
        # Kinoite) carries no MOK.der at all (2026-10-20).
        env:
          IMG: ${{ steps.ref.outputs.to }}
        run: |
          set -euo pipefail
          sudo podman run --rm --entrypoint /usr/bin/cat "$IMG" /usr/share/cert/MOK.der | cat > MOK.der
          openssl x509 -inform DER -in MOK.der -out MOK.pem
          virt-fw-vars --input /usr/share/OVMF/OVMF_VARS_4M.ms.fd --output sb-vars.fd \
            --add-mok 605dab50-e046-4300-abb6-3dd810dd8b23 MOK.pem

      - name: Boot, layer, rebase, reboot, check
        env:
          TO: ${{ steps.ref.outputs.to }}
          TRANSPORT: ${{ matrix.transport }}
          LAYER: ${{ matrix.layer }}
          EXPECT_ID_LIKE: ${{ matrix.expect_id_like }}
        run: |
          set -euo pipefail
          QCOW=$(ls output/qcow2/*.qcow2 | head -1)
          python3 .github/scripts/upgrade-smoke.py --disk "$QCOW" --sb-vars sb-vars.fd \
            --to "$TO" --transport "$TRANSPORT" --layer "$LAYER" --expect-id-like "$EXPECT_ID_LIKE" --log serial.log \
            | tee driver.log
          grep -q '^MARGINE-UPGRADE: PASS' driver.log

      - name: Summary
        if: always()
        run: |
          {
            echo "### Upgrade smoke: ${{ matrix.name }}"
            echo
            echo "- installed: \`${{ steps.ref.outputs.from }}\`"
            echo "- target: \`${{ steps.ref.outputs.to }}\` (${{ matrix.transport }}, layer: ${{ matrix.layer || 'none' }})"
            echo
            echo '```'
            grep -E 'MARGINE-UPGRADE|FAIL:|old deployment|booted deployment|validator' -A3 driver.log 2>/dev/null | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # One artifact per cell: a run holds several.
          name: upgrade-smoke-logs-${{ matrix.slug }}
          path: |
            serial.log
            driver.log
            qemu.err
          retention-days: 7

      - name: Notify ntfy (this starting point failed)
        if: failure()
        env:
          NTFY_URL: ${{ secrets.NTFY_TOPIC_URL }}
          CELL: ${{ matrix.name }}
          FROM_REF: ${{ matrix.from_ref }}
          TO_REF: ${{ matrix.to_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ -z "${NTFY_URL:-}" ]]; then
            echo "NTFY_TOPIC_URL secret not set, skipping notification."
            exit 0
          fi
          REASON="$(grep -oE 'MARGINE-UPGRADE: FAIL.*' driver.log 2>/dev/null | tail -n1 | cut -c1-400 || true)"
          curl --silent --show-error --fail \
            -H "Title: Upgrade smoke FAILED: ${CELL}" \
            -H "Priority: high" \
            -H "Tags: x,arrows_counterclockwise" \
            -H "Click: ${RUN_URL}" \
            -d "${FROM_REF} -> ${TO_REF}: ${REASON:-no verdict reached (the VM never got there, or an earlier step failed); see the run log}" \
            "$NTFY_URL" || echo "ntfy notify failed (non-fatal)"
