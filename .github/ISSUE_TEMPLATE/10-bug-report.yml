name: Bug report
description: Something in Lucciola does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Tip: on Lucciola, run
        `ujust lucciola-report` in a terminal. It collects the info below
        into one file you can paste here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, what happened instead.
    validations:
      required: true
  - type: input
    id: iso
    attributes:
      label: Image version
      description: The output of `rpm-ostree status -b | head -3`
      placeholder: ghcr.io/daniel-g-carrasco/lucciola:stable
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How did you get Lucciola on this machine
      options:
        - Switched from Fedora Silverblue or another Fedora Atomic system
        - Moved from Margine OS
        - Update of an existing Lucciola install
    validations:
      required: true
  - type: dropdown
    id: sb
    attributes:
      label: Secure Boot
      options:
        - Enabled, key enrolled
        - Enabled, key NOT enrolled (or not sure)
        - Disabled
        - Not sure
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and details
      description: Paste the relevant part of `journalctl -b`, the `ujust lucciola-report` output, or a photo/screenshot of the error.
      render: text
