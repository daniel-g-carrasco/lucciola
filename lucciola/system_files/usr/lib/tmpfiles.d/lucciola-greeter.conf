# Lucciola's login screen: greetd running Noctalia Greeter (lucciola/build.sh).
#
# greetd's home. Fedora's greetd package creates /var/lib/greetd only through
# the image's /var, which an installed system updating into this image never
# receives (bootc seeds /var once, at install), and its own tmpfiles line
# (Z) fixes ownership of an existing directory without creating it. Same for
# the xdg-desktop-portal mask its %post writes for the greeter account: the
# greeter needs no portal, and a portal activated in its session only waits.
d /var/lib/greetd                                         0750 greetd greetd -
d /var/lib/greetd/.config                                 0755 greetd greetd -
d /var/lib/greetd/.config/systemd                         0755 greetd greetd -
d /var/lib/greetd/.config/systemd/user                    0755 greetd greetd -
L /var/lib/greetd/.config/systemd/user/xdg-desktop-portal.service - - - - /dev/null
#
# Noctalia Greeter's state. Owned by the greeter account: the greeter writes
# sync.toml there, and the Sync helper writes as the directory's owner.
# greeter.toml: the fixed settings, a link into the image so updates arrive
# (L, not L+: a file an administrator puts there instead is left alone).
# sync.toml: the starting look and session, copied once; the greeter and
# Sync own it from then on, and a deleted copy comes back at the next boot.
d /var/lib/noctalia-greeter                               0750 greetd greetd -
L /var/lib/noctalia-greeter/greeter.toml                  -    -      -      - /usr/share/lucciola/greeter/greeter.toml
C /var/lib/noctalia-greeter/sync.toml                     0644 greetd greetd - /usr/share/lucciola/greeter/sync.toml
