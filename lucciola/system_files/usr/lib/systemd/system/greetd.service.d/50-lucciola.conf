# Lucciola: GDM stays installed as the login screen of last resort.
#
# greetd exits when its greeter dies without starting a session, and the
# unit restarts it. If that keeps happening (5 starts within 2 minutes, a
# wider window than Fedora's 30 s so a greeter that crashes after a few
# seconds is caught too), the unit fails and systemd starts GDM instead:
# a broken greeter must never leave a machine without a way to log in.
# OnFailure= fires only once the restarts are used up, not at every crash
# (systemd NEWS, "OnFailure= is used in combination with Restart=").
#
# Conflicts=gdm.service: two display managers must never fight over the
# same VT, whichever of the two gets started by hand.
[Unit]
OnFailure=gdm.service
Conflicts=gdm.service
StartLimitIntervalSec=120
StartLimitBurst=5
