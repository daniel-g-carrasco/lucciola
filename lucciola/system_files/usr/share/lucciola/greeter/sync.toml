# Lucciola: the login screen's starting session. Copied once to
# /var/lib/noctalia-greeter/sync.toml (lucciola-greeter.conf in tmpfiles.d)
# when that file does not exist; from then on it belongs to the greeter,
# which rewrites it at every login (the last session, the picked scheme),
# and to "Sync with Noctalia" (Noctalia's Settings > Security > Noctalia
# Greeter), which adds the desktop's monitor layout and appearance. Delete
# the copy to get this back at the next boot.
#
# The look (colours, font, wallpaper) is in greeter.toml, which wins over
# this file: see the comment there for why it is not here.

[session]
# The session the greeter preselects until someone picks another.
last = "Lucciola"
