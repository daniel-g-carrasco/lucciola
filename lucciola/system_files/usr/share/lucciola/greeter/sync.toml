# Lucciola: the login screen's starting look and session. Copied once to
# /var/lib/noctalia-greeter/sync.toml (lucciola-greeter.conf in tmpfiles.d)
# when that file does not exist; from then on it belongs to the greeter and
# to "Sync with Noctalia" (Noctalia's Settings > Security > Noctalia Greeter),
# which replace these values with the desktop's own. Delete the copy to get
# these defaults back at the next boot.
#
# The same look as Lucciola's Noctalia (20-margine-style.toml): dark, the
# Margine palette (palettes/Margine.json, keys renamed the greeter's way),
# JetBrains Mono, libadwaita-like corners. The wallpaper is Lucciola's, the
# desktop's and GDM's too. Installed systems keep the copy they have, whose
# path (/usr/share/backgrounds/margine/margine.png) now links to the same
# image. Scale is left automatic: the greeter scales each screen from its
# physical size (2 on the 2880x1920 13.5" reference laptop, capped at 2),
# and Sync copies the desktop's own scales.

[session]
# The session the greeter preselects until someone picks another.
last = "Lucciola"

[appearance]
scheme = "Synced"
theme_mode = "dark"
font_family = "JetBrains Mono"
corner_radius_scale = 1.0

[appearance.palette]
primary = "#e6d5bf"
on_primary = "#121212"
secondary = "#c2a180"
on_secondary = "#121212"
tertiary = "#cba6f7"
on_tertiary = "#121212"
error = "#ff938c"
on_error = "#121212"
surface = "#121212"
on_surface = "#ece6df"
surface_variant = "#1f1f1f"
on_surface_variant = "#b8b2ab"
outline = "#3a3a40"
shadow = "#000000"
hover = "#2e2e32"
on_hover = "#ffffff"

[appearance.wallpaper]
path = "/usr/share/backgrounds/lucciola/lucciola.png"
fill_mode = "crop"
fill_color = "#121212"
