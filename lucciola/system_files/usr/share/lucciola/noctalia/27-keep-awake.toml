# Keep Awake (/usr/libexec/lucciola/keep-awake) has its own Noctalia plugin,
# shipped read-only with the image as a path source and enabled here: a bar
# indicator that appears only while Keep Awake is on or scheduled, a
# control-centre tile in place of Noctalia's caffeine, a panel with quick
# durations and a scheduler, and launcher results ("awake", "sveglio", "2h").
# Noctalia's caffeine is still what keeps its own idle lock away while Keep
# Awake holds with the screen on (--screen); it just no longer has a button
# of its own. In the default mode the idle lock stays as it is.
[[plugins.source]]
name = "lucciola"
kind = "path"
location = "/usr/share/lucciola/noctalia/plugins"
enabled = true

# The one list of enabled Lucciola plugins (a second fragment setting it
# would replace this one): Keep Awake, Updates (29-updates.toml) and Remote
# Login (30-remote-login.toml).
[plugins]
enabled = ["lucciola/keep_awake", "lucciola/updates", "lucciola/remote_login"]

[widget.keep-awake]
type = "lucciola/keep_awake:indicator"

[[control_center.shortcuts]]
type = "wifi"
[[control_center.shortcuts]]
type = "bluetooth"
[[control_center.shortcuts]]
type = "lucciola/keep_awake:tile"
[[control_center.shortcuts]]
type = "lucciola/remote_login:tile"
[[control_center.shortcuts]]
type = "nightlight"
[[control_center.shortcuts]]
type = "notification"
[[control_center.shortcuts]]
type = "power_profile"
