# Panels, dock and motion, as settled after a week of daily use (2026-10-10).
# Sorted after 20-margine-style.toml, so these win over it; a user's own
# files and the GUI choices in ~/.local/state still win over these.

[bar.default]
# The bar's outline in the primary colour (beige with the Margine palette),
# like the focused window's border.
border = "on_primary"

[shell.animation]
speed = 1.5

[shell.panel]
# The control centre hangs from the bar; launcher, session and wallpaper
# panels stay floating (20-margine-style.toml).
control_center_placement = "attached"
shadow = true
floating_offset = 6
list_item_background = true

# A dock, as Margine's GNOME has one: on the active monitor only, small
# icons, a little off the bottom edge. The launcher button first, then the
# everyday apps (browser, mail, files, terminal, the app store), then
# Lucciola's own tools (updates, CPU scheduler, the guide). Pins of an app
# that is not installed are skipped. Pinning or unpinning from the dock
# writes the user's own list, which wins over this one.
[dock]
enabled = true
launcher_position = "start"
pinned = [
  "app.zen_browser.zen.desktop",
  "org.mozilla.thunderbird_esr.desktop",
  "org.gnome.Nautilus.desktop",
  "org.gnome.Ptyxis.desktop",
  "io.github.kolunmi.Bazaar.desktop",
  "dev.margine.System.desktop",
  "margine-scheduler.desktop",
  "lucciola-guide.desktop",
]
active_monitor_only = true
icon_size = 34
item_spacing = 12
main_axis_padding = 12
cross_axis_padding = 2
margin_edge = 2
margin_ends = 64
launcher_icon = "grid-goldenratio"
