# Keep Awake for Lucciola: no suspend, and the lid locks the session instead
# of suspending it (with --screen the screen stays on and the idle lock away
# too), now, until a chosen time, or from a scheduled time. The work is done
# by /usr/libexec/lucciola/keep-awake (a logind inhibitor in a transient user
# unit that watches the lid, scheduled starts as transient timers); this
# plugin is its face:
#
#   service   -> polls `keep-awake status --json`, runs the commands the UI
#                entries send through noctalia.state
#   indicator -> bar glyph: lit while on, a clock while scheduled, dim when
#                off (show_when_idle = false hides it then)
#   tile      -> control-centre toggle (right click opens the panel)
#   panel     -> quick durations and a scheduler
#   launcher  -> "awake", "sveglio", "2h", "18:30" in the launcher
id = "lucciola/keep_awake"
name = "Keep Awake"
version = "1.0.0"
plugin_api = 24
author = "lucciola"
license = "MIT"
icon = "zzz-off"
description = "Keep the laptop awake now, until a time, or from a scheduled time; the lid locks the session instead of suspending it."
tags = ["power", "suspend", "lid", "lock"]
dependencies = ["systemd"]

[[setting]]
key = "command"
type = "string"
label_key = "settings.command.label"
description_key = "settings.command.description"
default = "/usr/libexec/lucciola/keep-awake"
advanced = true

[[service]]
id = "service"
entry = "service.luau"

[[widget]]
id = "indicator"
entry = "indicator.luau"

  [[widget.setting]]
  key = "show_when_idle"
  type = "bool"
  label_key = "settings.show_when_idle.label"
  description_key = "settings.show_when_idle.description"
  default = true

  [[widget.setting]]
  key = "show_time"
  type = "bool"
  label_key = "settings.show_time.label"
  description_key = "settings.show_time.description"
  default = false

[[shortcut]]
id = "tile"
entry = "tile.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 400
height = 600
placement = "attached"
position = "auto"
open_near_click = true

[[launcher_provider]]
id = "launcher"
entry = "launcher.luau"
prefix = "awake"
glyph = "zzz-off"
include_in_global_search = true
