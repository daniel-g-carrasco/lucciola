# Lucciola: read by the greetd PAM service (pam_env, before pam_systemd
# registers the session). A greeter passes XDG_SESSION_TYPE to greetd with
# the session it starts; greetd's [initial_session] (autologin) passes no
# environment, and without the variable logind records a "tty" session,
# which GNOME Shell does not accept as a graphical one. Every session greetd
# starts here is a Wayland one, so wayland is the default; a value the
# greeter sent wins.
XDG_SESSION_TYPE DEFAULT=wayland OVERRIDE=${XDG_SESSION_TYPE}
