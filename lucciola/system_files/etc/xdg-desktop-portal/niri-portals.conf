# Lucciola: niri's own portals.conf (/usr/share/xdg-desktop-portal/
# niri-portals.conf) sends the Secret portal to gnome-keyring, which Fedora 45
# no longer ships: oo7 is the keyring. Without this, Flatpak apps that keep
# their passwords through libsecret (Spola, Fractal, Deja Dup, Bazaar...)
# cannot open their keyring and look signed out. /etc wins over /usr/share.
# RemoteDesktop goes to luminous (lucciola/build.sh 5g): the GNOME backend
# serves it only on Mutter's D-Bus, which niri does not implement, and the
# phone's mouse and keyboard (KDE Connect) go through that portal.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=oo7-portal;
org.freedesktop.impl.portal.RemoteDesktop=luminous;
