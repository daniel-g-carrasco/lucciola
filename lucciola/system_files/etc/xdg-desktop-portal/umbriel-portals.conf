# Lucciola: the portals of the Umbriel session. /etc wins over Umbriel's own
# /usr/share/xdg-desktop-portal/umbriel-portals.conf.
# - Umbriel's backend (xdg-desktop-portal-umbriel) for what only the
#   compositor can do: screen sharing, screenshots, global shortcuts, input
#   capture. GNOME's and GTK's for the rest (file chooser, settings, ...).
# - Secret to oo7: Fedora 45 has no gnome-keyring. Without this, Flatpak apps
#   that keep their passwords through libsecret (Spola, Fractal, Deja Dup,
#   Bazaar...) cannot open their keyring and look signed out.
# - RemoteDesktop to luminous (lucciola/build.sh 5g): the GNOME backend
#   serves it only on Mutter's D-Bus; luminous uses the virtual pointer and
#   keyboard protocols Umbriel offers, for the phone's mouse and keyboard
#   (KDE Connect).
# - Wallpaper to Lucciola's own backend (/usr/libexec/lucciola/
#   wallpaper-portal): GNOME's sets a GNOME Shell setting, and "Set as
#   Background" in an app did nothing. Ours hands the picture to Noctalia.
[preferred]
default=umbriel;gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=oo7-portal;
org.freedesktop.impl.portal.RemoteDesktop=luminous;
org.freedesktop.impl.portal.Wallpaper=lucciola;
